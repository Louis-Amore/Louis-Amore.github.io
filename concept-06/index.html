<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Louis Amore — Photographer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* ---------- design tokens, from the Modernist system handoff ---------- */
:root{
  --ground:#f3f2f2; --ink:#201e1d; --red:#ec3013; --red-pressed:#c02409;
  --muted:#6b6664; --hairline:#c9c5c2; --placeholder:#dedad7;
  --font:'Archivo', sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0;}
body{
  font-family:var(--font); background:var(--ground); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{ font-family:inherit; background:none; border:0; cursor:pointer; color:inherit; padding:0; }
a{ color:inherit; text-decoration:none; }
img{ display:block; }
.hot{ cursor:pointer; }
.hot:hover{ color:var(--red); }
:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

/* ---------- header, identical across all three views ---------- */
.app{ height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.hdr{
  flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
  padding:0 32px; height:60px; border-bottom:2px solid var(--ink);
}
.hdr .wordmark{ display:flex; align-items:baseline; gap:12px; cursor:pointer; }
.hdr .wordmark .name{ font-size:16px; font-weight:800; letter-spacing:-0.01em; }
.hdr .wordmark .role{ font-size:10px; font-weight:600; letter-spacing:0.2em; color:var(--muted); }
.hdr nav{ display:flex; gap:24px; font-size:11px; font-weight:700; letter-spacing:0.14em; }
.hdr nav .contact{ color:var(--red); }

/* ---------- home ---------- */
.home-imgs{
  flex:1; display:grid; grid-template-columns:1.55fr 1fr; grid-template-rows:minmax(0,1fr);
  min-height:0;
}
.home-imgs > div{
  position:relative; overflow:hidden; background:var(--placeholder); cursor:pointer; min-height:0;
}
.home-imgs > div:first-child{ border-right:2px solid var(--ink); }
.home-imgs img{ width:100%; height:100%; object-fit:cover; }
.home-imgs .right img{ object-position:50% 22%; }

/* ---------- red band (home + collapsed variants) ---------- */
.band{ flex:0 0 auto; background:var(--red); color:#fff; padding:18px 32px 20px; }
.band-home{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.band-cats{ display:flex; flex-wrap:wrap; gap:0 40px; }
.band-cats .cat{ display:flex; align-items:baseline; gap:6px; cursor:pointer; transition:opacity .15s; }
.band-cats .cat:hover{ opacity:0.72; }
.band-cats .cat .nm{ font-size:40px; font-weight:800; letter-spacing:-0.02em; color:#fff; line-height:1; }
.band-cats .cat .ct{ font-size:12px; font-weight:600; color:rgba(255,255,255,0.72); }
.band-meta{ text-align:right; font-size:11px; font-weight:700; letter-spacing:0.14em; white-space:nowrap; }
.band-meta div + div{ margin-top:4px; }

/* ---------- set view ---------- */
.title-bar{
  flex:0 0 auto; padding:18px 32px 14px; border-bottom:2px solid var(--ink);
  display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
}
.title-bar .left{ display:flex; align-items:baseline; gap:14px; }
.title-bar .catname{ font-size:44px; font-weight:800; letter-spacing:-0.03em; line-height:1; }
.title-bar .count{ font-size:12px; font-weight:700; color:var(--red); }
.title-bar .hint{ font-size:11px; font-weight:700; letter-spacing:0.12em; color:var(--muted); }

.set-scroll{ flex:1; min-height:0; overflow-y:auto; background:var(--ink); }
.grid{
  display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(160px,1fr);
  gap:2px; background:var(--ink); padding:2px;
}
.grid .cell{ position:relative; overflow:hidden; background:var(--placeholder); cursor:pointer; min-height:0; }
.grid .cell.lead{ grid-column:span 2; grid-row:span 2; }
.grid .cell img{ width:100%; height:100%; object-fit:cover; display:block; transition:opacity .15s; }
.grid .cell:hover img{ opacity:0.88; }

.band-set{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.band-set .active{ font-size:40px; font-weight:800; color:#fff; cursor:pointer; }
.band-set .active:hover{ opacity:.85; }
.sibs{ display:flex; flex-wrap:wrap; gap:0 26px; align-items:baseline; margin-left:26px; }
.sibs a{ font-size:12px; font-weight:700; letter-spacing:0.1em; color:rgba(255,255,255,0.8); cursor:pointer; }
.sibs a:hover{ color:#fff; }
.band-set-left{ display:flex; align-items:baseline; flex-wrap:wrap; }
.band-set .next{ font-size:11px; font-weight:700; letter-spacing:0.14em; color:#fff; cursor:pointer; white-space:nowrap; }
.band-set .next:hover{ opacity:.8; }

/* ---------- single image ---------- */
.single-body{
  flex:1; min-height:0; display:grid; grid-template-columns:1fr 280px; grid-template-rows:minmax(0,1fr);
}
.single-photo{ position:relative; overflow:hidden; border-right:2px solid var(--ink); background:var(--placeholder); min-height:0; }
.single-photo img{ width:100%; height:100%; object-fit:cover; }
.margin{ padding:26px 24px; display:flex; flex-direction:column; gap:20px; overflow-y:auto; }
.margin .setlabel{ font-size:10px; font-weight:600; letter-spacing:0.18em; color:var(--red); margin-bottom:6px; }
.margin .setname{ font-size:22px; font-weight:800; letter-spacing:-0.02em; }
.meta-block{ border-top:2px solid var(--ink); padding-top:14px; display:flex; flex-direction:column; gap:8px; }
.meta-row{ display:flex; justify-content:space-between; font-size:12px; }
.meta-row .lbl{ color:var(--muted); }
.meta-row .val{ font-weight:700; color:var(--ink); }
.thumbs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.thumbs .th{ height:84px; overflow:hidden; cursor:pointer; }
.thumbs .th img{ width:100%; height:100%; object-fit:cover; display:block; }
.thumbs .th.on img{ outline:2px solid var(--red); outline-offset:-2px; }
.enquire{ margin-top:auto; font-size:11px; font-weight:700; letter-spacing:0.13em; cursor:pointer; }
.enquire:hover{ color:var(--red); }

.band-pager{ display:flex; align-items:center; justify-content:space-between; }
.band-pager .nav{ font-size:11px; font-weight:700; letter-spacing:0.14em; color:#fff; cursor:pointer; white-space:nowrap; }
.band-pager .nav:hover{ opacity:.8; }
.band-pager .ctr{ font-size:34px; font-weight:800; letter-spacing:-0.02em; color:#fff; text-align:center; }
.band-pager .ctr .n{ font-size:13px; font-weight:600; color:rgba(255,255,255,0.85); margin-left:6px; }

/* ---------- mobile: stack, since the source spec left this an open task ---------- */
@media (max-width:900px){
  body{ overflow:auto; }
  .app{ height:auto; overflow:visible; }
  .home-imgs{ grid-template-columns:1fr; grid-auto-rows:46vh; }
  .home-imgs > div:first-child{ border-right:0; border-bottom:2px solid var(--ink); }
  .band-cats .cat .nm{ font-size:28px; }
  .band-home, .band-set{ flex-direction:column; align-items:flex-start; }
  .band-meta{ text-align:left; }
  .sibs{ margin-left:0; }
  .hdr{ padding:0 18px; }
  .hdr nav{ gap:12px; flex-wrap:wrap; row-gap:2px; }
  .hdr .wordmark .role{ display:none; }
  .band, .title-bar{ padding-left:18px; padding-right:18px; }
  .band-set-left{ flex-direction:column; align-items:flex-start; gap:6px; }
  .single-body{ grid-template-columns:1fr; grid-auto-rows:auto; }
  .single-photo{ border-right:0; border-bottom:2px solid var(--ink); height:56vh; }
  .set-scroll{ max-height:none; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const BASE = "https://louis-amore.github.io/concept-05/photos/";
const CATS = ["Commercial", "Fashion", "Portrait", "Interiors", "Personal"];
const DATA = {"Commercial": ["commercial-50.jpg", "commercial-51.jpg", "commercial-34.jpg", "commercial-58.jpg", "commercial-59.jpg", "commercial-60.jpg", "commercial-52.jpg", "commercial-53.jpg", "commercial-54.jpg", "commercial-55.jpg", "commercial-56.jpg"], "Fashion": ["fashion-18.jpg", "fashion-02.jpg", "fashion-06.jpg", "fashion-image13.jpg", "fashion-16.jpg", "fashion-17.jpg", "fashion-25.jpg", "fashion-41.jpg", "fashion-01.jpg", "fashion-03.jpg", "fashion-05.jpg", "fashion-image06.jpg", "fashion-07.jpg", "fashion-09.jpg", "fashion-11.jpg", "fashion-12.jpg", "fashion-13.jpg", "fashion-15.jpg", "fashion-19.jpg", "fashion-40.jpg", "fashion-42.jpg"], "Portrait": ["portrait-12.jpg", "portrait-14.jpg", "portrait-15.jpg", "portrait-30.jpg", "portrait-07.jpg", "portrait-33.jpg", "portrait-35.jpg", "portrait-41.jpg", "portrait-42.jpg", "portrait-43.jpg", "portrait-49.jpg", "portrait-51.jpg", "portrait-56.jpg", "portrait-58.jpg", "portrait-59.jpg", "portrait-60.jpg", "portrait-65.jpg"], "Interiors": ["interiors-03.jpg", "interiors-10.jpg", "interiors-11.jpg", "interiors-26.jpg", "interiors-38.jpg", "interiors-16.jpg", "interiors-35.jpg", "interiors-36.jpg", "interiors-37.jpg", "interiors-39.jpg", "interiors-40.jpg", "interiors-67.jpg", "interiors-68.jpg", "interiors-69.jpg", "interiors-70.jpg"], "Personal": ["bali-04.jpg", "street-05.jpg", "personal-08.jpg", "personal-image09.jpg", "personal-20.jpg", "landscape-23.jpg", "personal-24.jpg", "landscape-27.jpg", "personal-32.jpg", "personal-40.jpg", "landscape-40.jpg", "landscape-41.jpg", "bali-05.jpg", "bali-06.jpg", "bali-07.jpg", "bali-10.jpg", "bali-11.jpg", "bali-12.jpg", "bali-13.jpg", "bali-14.jpg", "bali-15.jpg", "personal-02.jpg", "personal-03.jpg", "personal-04.jpg", "personal-05.jpg", "personal-09.jpg", "personal-12.jpg", "personal-41.jpg", "wsr-01.jpg", "wsr-02.jpg", "wsr-03.jpg", "wsr-04.jpg", "wsr-05.jpg", "wsr-06.jpg", "wsr-07.jpg", "wsr-08.jpg", "wsr-09.jpg", "wsr-10.jpg", "wsr-11.jpg", "wsr-12.jpg", "wsr-13.jpg", "wsr-14.jpg", "wsr-15.jpg", "wsr-16.jpg", "wsr-17.jpg", "wsr-18.jpg", "wsr-19.jpg", "wsr-20.jpg", "wsr-21.jpg", "wsr-22.jpg", "wsr-23.jpg", "wsr-24.jpg", "wsr-25.jpg", "vape-01.jpg", "vape-02.jpg", "vape-03.jpg", "vape-04.jpg", "vape-05.jpg", "vape-06.jpg", "vape-07.jpg", "vape-08.jpg"]}; // category -> array of filenames

function url(f){ return BASE + f; }
function thumbUrl(f){ return BASE + 'thumb/' + f; }

let state = { view:'home', cat:0, idx:0 };

function go(next){ state = Object.assign({}, state, next); render(); }

function header(navLeft){
  return `<div class="hdr">
    <div class="wordmark hot" onclick="go({view:'home'})">
      <span class="name">LOUIS AMORE</span><span class="role">PHOTOGRAPHER</span>
    </div>
    <nav>
      ${navLeft}
      <span class="hot" onclick="window.open('https://www.instagram.com/louis_amore_photographer/','_blank')">INSTAGRAM</span>
      <span class="hot" onclick="window.open('https://www.linkedin.com/in/louisamore/','_blank')">LINKEDIN</span>
      <span class="hot contact" onclick="location.href='mailto:louis.amore@gmail.com'">CONTACT</span>
    </nav>
  </div>`;
}

function renderHome(){
  const fashion = DATA['Fashion'][0];
  const portrait = DATA['Portrait'][2] || DATA['Portrait'][0];
  const catsHtml = CATS.map((c,i)=>`
    <div class="cat hot" onclick="go({view:'set',cat:${i},idx:0})">
      <span class="nm">${c.toUpperCase()}</span><span class="ct">${DATA[c].length}</span>
    </div>`).join('');
  return `<div class="app">
    ${header('<span class="hot" onclick="go({view:\'set\',cat:1,idx:0})">WORK</span>')}
    <div class="home-imgs">
      <div onclick="go({view:'image',cat:1,idx:0})"><img src="${url(fashion)}" alt="Fashion"></div>
      <div class="right" onclick="go({view:'image',cat:2,idx:2})"><img src="${url(portrait)}" alt="Portrait"></div>
    </div>
    <div class="band">
      <div class="band-home">
        <div class="band-cats">${catsHtml}</div>
        <div class="band-meta">
          <div>LONDON — AVAILABLE FOR COMMISSIONS</div>
          <div>LOUIS.AMORE@GMAIL.COM</div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderSet(){
  const cat = CATS[state.cat];
  const list = DATA[cat];
  // spec's fixed 4x2 hero (lead + 4 units) extends with plain unit cells below
  // for sets beyond 5 — the source design only specced 5 cells and explicitly
  // left larger-set browsing an open question, but Louis's real categories
  // run up to 61 photos, so the grid scrolls to reach all of them.
  const cells = list.map((f,i)=>`
    <div class="cell ${i===0?'lead':''}" onclick="go({view:'image',cat:${state.cat},idx:${i}})">
      <img src="${thumbUrl(f)}" loading="${i<8?'eager':'lazy'}" alt="${cat} ${i+1}">
    </div>`).join('');
  const others = CATS.map((c,i)=>i).filter(i=>i!==state.cat);
  const sibs = others.map(i=>`<a onclick="go({view:'set',cat:${i},idx:0})">${CATS[i].toUpperCase()} ${DATA[CATS[i]].length}</a>`).join('');
  const nextIdx = (state.cat+1) % CATS.length;
  return `<div class="app">
    ${header(`<span class="hot" onclick="go({view:'home'})">← ALL WORK</span>`)}
    <div class="title-bar">
      <div class="left"><span class="catname">${cat.toUpperCase()}</span><span class="count">${list.length} IMAGES</span></div>
      <div class="hint">CLICK AN IMAGE</div>
    </div>
    <div class="set-scroll"><div class="grid">${cells}</div></div>
    <div class="band">
      <div class="band-set">
        <div class="band-set-left">
          <span class="active hot" onclick="go({view:'set',cat:${state.cat},idx:0})">${cat.toUpperCase()}</span>
          <div class="sibs">${sibs}</div>
        </div>
        <div class="next hot" onclick="go({view:'set',cat:${nextIdx},idx:0})">NEXT SET: ${CATS[nextIdx].toUpperCase()} →</div>
      </div>
    </div>
  </div>`;
}

function renderImage(){
  const cat = CATS[state.cat];
  const list = DATA[cat];
  const f = list[state.idx];
  const thumbs = list.slice(0,4).map((t,i)=>`
    <div class="th ${i===state.idx?'on':''}" onclick="go({idx:${i}})"><img src="${thumbUrl(t)}" alt=""></div>`).join('');
  return `<div class="app">
    ${header(`<span class="hot" onclick="go({view:'set',idx:0})">← ${cat.toUpperCase()}</span>`)}
    <div class="single-body">
      <div class="single-photo"><img src="${url(f)}" alt="${cat} ${state.idx+1}"></div>
      <div class="margin">
        <div>
          <div class="setlabel">SET</div>
          <div class="setname">${cat.toUpperCase()}</div>
        </div>
        <div class="meta-block">
          <div class="meta-row"><span class="lbl">LOCATION</span><span class="val">LONDON</span></div>
          <div class="meta-row"><span class="lbl">YEAR</span><span class="val">2024</span></div>
          <div class="meta-row"><span class="lbl">FRAME</span><span class="val">${String(state.idx+1).padStart(2,'0')} / ${list.length}</span></div>
        </div>
        <div class="thumbs">${thumbs}</div>
        <div class="enquire hot" onclick="location.href='mailto:louis.amore@gmail.com'">ENQUIRE ABOUT THIS SHOOT →</div>
      </div>
    </div>
    <div class="band">
      <div class="band-pager">
        <span class="nav hot" onclick="prevImg()">← PREVIOUS</span>
        <span class="ctr">${cat.toUpperCase()} <span class="n">${String(state.idx+1).padStart(2,'0')} / ${list.length}</span></span>
        <span class="nav hot" onclick="nextImg()">NEXT →</span>
      </div>
    </div>
  </div>`;
}

function prevImg(){
  const n = DATA[CATS[state.cat]].length;
  go({ idx: (state.idx - 1 + n) % n });
}
function nextImg(){
  const n = DATA[CATS[state.cat]].length;
  go({ idx: (state.idx + 1) % n });
}

function render(){
  const root = document.getElementById('app');
  if (state.view === 'home') root.innerHTML = renderHome();
  else if (state.view === 'set') root.innerHTML = renderSet();
  else root.innerHTML = renderImage();
  // every element with an onclick handler should also be reachable and
  // activatable by keyboard, per the spec's focus-visible requirement —
  // the source prototype's own divs/spans weren't, so this is an addition
  root.querySelectorAll('[onclick]').forEach(el => {
    el.setAttribute('tabindex', '0');
    if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
  });
}
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.hasAttribute('onclick')) {
    e.preventDefault();
    document.activeElement.click();
  }
});

document.addEventListener('keydown', e => {
  if (state.view !== 'image') return;
  if (e.key === 'ArrowLeft') prevImg();
  else if (e.key === 'ArrowRight') nextImg();
  else if (e.key === 'Escape') go({ view:'set' });
});

render();
</script>
</body>
</html>
