<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Louis Amore — Concept 05</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>

:root{
  --bg:#efece6;
  --ink:#111110;
  --muted:#79766e;
  --font-display:'Archivo', sans-serif;
  --font-body:'Public Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; overflow-x:clip; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
}
body{
  /* EDIT: a few frames deliberately bleed past the right edge; clip rather
     than scroll so they read as a bleed instead of producing a stray
     horizontal scrollbar. 'clip' (not 'hidden') avoids creating a scroll
     container, which would break the fixed name/nav/footer/lightbox. */
  overflow-x:clip;
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }

/* the fixed, unmoving name — always readable via blend-mode, whatever
   scrolls beneath it */
.fixed-name{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:5; pointer-events:none;
}
.fixed-name h1{
  font-family:var(--font-display); font-weight:900; color:var(--ink);
  font-size:clamp(28px, 4.9vw, 67px); text-align:center; letter-spacing:-0.02em;
  line-height:0.95; margin:0; text-transform:uppercase; white-space:nowrap;
}
.fixed-name .role{
  font-family:var(--font-mono); color:var(--muted); font-size:11px; letter-spacing:.16em; font-weight:700;
  text-transform:uppercase; text-align:center; margin-top:14px;
}
/* fixed corner nav, same blend trick so it's always legible */
.corner-nav{
  position:fixed; top:26px; left:0; right:0; z-index:41; pointer-events:none;
  display:flex; justify-content:space-between; padding:0 28px; mix-blend-mode:difference;
}
.corner-nav a, .corner-nav span{ color:#fff; font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; pointer-events:auto; }
.corner-nav .links{ display:flex; gap:18px; }

/* scrolling field of scattered work */
/* ---------- INDEX (permanent left column) ----------
   The category list sits fixed on the left of the main screen at all times.
   Photos never reach it because .field-inner is inset past it — see
   --field-left below, which is sized to the widest row. */
.idx-list{
  position:fixed; left:40px; top:50%; transform:translateY(-50%);
  z-index:41; pointer-events:auto;
}
.idx-row{
  display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
  color:var(--ink); font-family:var(--font-display); font-weight:900; text-transform:uppercase;
  font-size:clamp(19px, 1.9vw, 27px); line-height:1.0; letter-spacing:-.02em;
  padding:2px 0; opacity:.5; transition:opacity .22s;
}
.idx-row:hover, .idx-row.on{ opacity:1; }
.idx-row .idx-n{
  font-family:var(--font-mono); font-weight:400; font-size:10px; letter-spacing:.1em;
  vertical-align:super; margin-left:9px; color:#8a7132;
}
.idx-subs{ display:none; padding:3px 0 9px; }
.idx-subs.open{ display:block; }
.idx-sub{
  display:block; background:none; border:0; cursor:pointer; color:#5f5c55;
  font-family:var(--font-display); font-weight:900; letter-spacing:-.02em;
  text-transform:uppercase; font-size:15px; padding:6px 0 6px 2px; transition:color .2s;
}
.idx-sub:hover, .idx-sub.on{ color:#b8a082; }
.idx-sub i{ font-style:normal; font-family:var(--font-mono); font-weight:400; color:#8a7132;
  margin-left:7px; font-size:10px; letter-spacing:.1em; }
@media (max-width:820px){
  .idx-list{ position:static; transform:none; padding:66px 24px 10px; }
  .idx-row{ font-size:24px; opacity:1; }
  /* the reserved-space trick exists purely to protect a hovering mouse —
     touch has no such thing, and a permanently blank gap here just looks
     like a layout bug, so fall back to plain show/hide on tap */
  .idx-subs.reserve{ display:none; opacity:1; pointer-events:auto; }
  .idx-subs.reserve.open{ display:block; }
}

.field{ position:relative; height:745vh; margin-top:6vh; }
/* EDIT: the nav is a fixed 163px wide (right edge 191px) at every viewport,
   so the photos need a fixed PIXEL inset to clear it, not a percentage.
   Every frame's left:% resolves against this band instead of the full page,
   which pulls the whole field in from both edges. --field-left is the
   clearance from the nav; --field-right keeps wide frames on screen. */
.field-inner{
  position:absolute; top:0; bottom:0;
  /* the gutter tracks the list's own scaling (rows are clamp(19,1.9vw,27)),
     so the photos give up exactly as much room as the type needs and no more */
  left:var(--field-left, clamp(250px, calc(16.2vw + 76px), 300px));
  right:var(--field-right, 40px);
  container-type:inline-size;
}
@media (max-width:760px){
  .field-inner{ position:static; left:auto; right:auto; }
}
.field-frame{
  position:absolute; z-index:10; background:#d8d4cb; overflow:hidden;
  display:flex; align-items:flex-end;
  font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase;
  opacity:0; transform:translateY(26px); transition:opacity .7s ease, transform .7s ease;
}
.field-frame.in{ opacity:1; transform:translateY(0); }
.field-frame span{ padding:14px; }
.field-frame img{ width:100%; height:100%; object-fit:cover; display:block; }

/* Double-border: an outer border on the frame itself, plus an inner border
   on a wrapping div around the photo — no gap between them since the inner
   border sits flush against the outer one. Customize per-photo with inline
   CSS variables, e.g.:
   style="--db-outer:12px; --db-outer-color:#fff; --db-inner:2px; --db-inner-color:#111110;" */
.field-frame.double-border{
  border: var(--db-outer, 12px) solid var(--db-outer-color, #ffffff);
}
.field-frame.double-border .db-inner{
  width:100%; height:100%; box-sizing:border-box;
  border: var(--db-inner, 2px) solid var(--db-inner-color, #111110);
  overflow:hidden;
}
.field-frame::before{
  content: 'Image ' attr(data-num);
  position:absolute; top:0; left:0; z-index:20;
  background:rgba(17,17,16,0.78); color:#fff;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.04em;
  padding:5px 9px; pointer-events:none;
}
.field-frame figcaption{
  position:absolute; left:0; right:0; bottom:0; padding:12px 14px;
  background:linear-gradient(0deg, rgba(0,0,0,0.45), transparent);
  color:#fff; font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  opacity:0; transition:opacity .2s ease;
}
.field-frame:hover figcaption{ opacity:1; }

.w-t1{ width:min(17cqw, 220px); aspect-ratio:2/3; }
.w-t2{ width:min(24cqw, 310px); aspect-ratio:2/3; }
.w-l1{ width:min(30cqw, 390px); aspect-ratio:3/2; }
.w-l2{ width:min(42cqw, 540px); aspect-ratio:3/2; }
.w-l2-big{ width:min(39.69cqw, 510.3px); aspect-ratio:3/2; } /* Image 10 only — 10% smaller than the previous 1.05x */
.w-l3{ width:min(54cqw, 700px); aspect-ratio:3/2; }

.field-frame.border-thick{ border:12px solid #111110; }
.field-frame.border-thin{ border:2px solid #111110; }
.field-frame.border-gold{ border:6px solid #a9852f; }
.field-frame.border-white{ border:12px solid #ffffff; }
.field-frame.border-white-thin{ border:2px solid #ffffff; }
.field-frame.border-white-thick{ border:24px solid #ffffff; }
/* ---------- rare heavy-border tier ----------
   Doubles of the existing weights, kept deliberately scarce. box-sizing is
   border-box on .field-frame, so a heavier border eats into the photo
   rather than growing the frame's outer box — safe on any frame with zero
   effect on position/overlap. Gold-thick is only ever applied to a frame
   that already carries gold, doubling its weight rather than introducing
   gold onto a photo that never had it. */
.field-frame.border-black-thick{ border:24px solid #111110; }
.field-frame.border-gold-thick{ border:12px solid #a9852f; }


.statement{ text-align:center; padding:8vh 28px 20vh; position:relative; z-index:1; }
.statement p{
  font-family:var(--font-display); font-weight:800; font-size:clamp(20px,3vw,32px);
  max-width:20ch; margin:0 auto; text-transform:uppercase; letter-spacing:-0.01em; line-height:1.2;
}

footer{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(239,236,230,0.92); backdrop-filter:blur(6px);
  padding:16px 28px; border-top:1px solid rgba(17,17,16,0.14);
  display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex-wrap:wrap; gap:12px;
}
/* --------------------------------------------------------------------- */
/* Lightbox — white rail + main image view                                */
/* --------------------------------------------------------------------- */

body.lb-open{ overflow:hidden; }

#lightbox{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  opacity:0; pointer-events:none; visibility:hidden;
  transition:opacity .3s ease, visibility 0s linear .3s;
  display:flex; flex-direction:column;
}
#lightbox.open{
  opacity:1; pointer-events:auto; visibility:visible;
  transition:opacity .3s ease, visibility 0s linear 0s;
}

.lb-topbar{
  display:grid; grid-template-columns:150px 1fr 150px; align-items:center;
  position:relative; z-index:5;
  padding:22px 28px; border-bottom:1px solid rgba(17,17,16,0.12);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  flex:0 0 auto;
}
.lb-topbar #lb-cat{ text-align:left; }
.lb-topbar .lb-count{ text-align:center; }
.lb-topbar #lb-close{ justify-self:end; }
.lb-topbar button{ background:none; border:none; color:var(--ink); font:inherit; cursor:pointer; }
.lb-topbar button:hover{ color:var(--muted); }
.lb-count{ color:var(--ink); }

.lb-body{ flex:1 1 auto; display:flex; min-height:0; }

.lb-rail{
  width:30vw; max-width:440px; flex:0 0 30vw; overflow-y:auto; padding:20px;
  display:block; position:relative; border-right:1px solid rgba(17,17,16,0.12);
  height:100%; min-height:0;
  /* invisible scrollbar — still scrolls, just no visible bar */
  scrollbar-width:none; -ms-overflow-style:none;
}
.lb-rail::-webkit-scrollbar{ width:0; height:0; display:none; }
.lb-thumb{
  position:absolute; margin:0; padding:0; background:#fff; cursor:pointer;
  box-shadow:0 6px 16px rgba(20,19,16,.14); opacity:1; border:none;
  transition:transform .25s ease, box-shadow .25s ease;
}
.lb-thumb:hover{ transform:scale(1.03); box-shadow:0 14px 30px rgba(20,19,16,.26); z-index:5; }
.lb-thumb.active{ opacity:1; }
.lb-thumb .ph{
  display:flex; align-items:center; justify-content:center; width:100%; height:100%;
  font-family:var(--font-mono); font-size:9px; color:var(--muted); text-transform:uppercase; background:#e7e4dc;
}
.lb-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

.lb-stage-wrap{
  /* pin to the whole viewport so the photo is dead-centre of the SCREEN
     (matching the approved layout); click-through except on the photo */
  position:fixed; inset:0; z-index:3; pointer-events:none;
  display:flex; align-items:center; justify-content:center; padding:40px;
}
#lightbox.open .lb-stage-wrap .lb-stage,
#lightbox.open .lb-stage-wrap .lb-frame,
#lightbox.open .lb-stage-wrap .lb-tags{ pointer-events:auto; }
/* keep the centring spacer hidden but SHOW the small tags box again, pinned
   to the top beside the photo */
.lb-stage::before{ display:none !important; }
.lb-stage{
  position:relative; max-width:100%; max-height:100%;
  display:flex; align-items:center; justify-content:center; gap:24px;
  transform:scale(.97); opacity:0; transition:transform .3s ease, opacity .3s ease;
}
#lightbox.open .lb-stage{ transform:scale(1); opacity:1; }

.lb-frame{
  background:#e7e4dc; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase;
  flex:0 0 auto; min-width:0;
  /* EDIT: bold white mat that expands AROUND the photo (content-box), so the
     border never crops into the image. Sizing is HEIGHT-driven: the frame
     height-caps the photo and its width follows the photo's own ratio — so
     portrait and standard photos no longer balloon to full width, and every
     ratio stays centred over the counter. The mat adds 60px on every side. */
  border:60px solid #ffffff; box-sizing:content-box;
  height:auto; max-height:calc(61.05vh);
  /* EDIT: cap width to the space BETWEEN the collage (30vw, max 440px on the
     left) and the info panel (320px on the right), minus the 120px mat and
     some breathing room — so on a narrow/snapped window the photo shrinks to
     fit instead of overflowing the panels. */
  max-width:calc(100vw - 30vw - 320px - 120px - 80px);
  box-shadow:0 24px 60px rgba(17,17,16,0.14);
}
/* the image itself carries BOTH caps; width follows naturally but never
   exceeds the available middle space */
.lb-frame.has-photo img{
  max-height:calc(61.05vh - 120px);
  max-width:calc(100vw - 30vw - 320px - 200px);
  width:auto; height:auto; display:block;
}
/* EDIT: We Shall Remember sized 7% smaller than the other categories */
.lb-frame.subcat-WSR.has-photo img{ max-height:calc(56.78vh - 120px); }
.lb-frame.ratio-landscape:not(.has-photo){ width:min(70vw, 900px); aspect-ratio:3/2; }
.lb-frame.ratio-portrait:not(.has-photo){ width:min(38vw, 480px); aspect-ratio:2/3; }
.lb-frame.has-photo{ width:auto; aspect-ratio:auto; }
.lb-frame span{ padding:16px; }
.lb-frame:not(.has-photo) img{ width:100%; height:100%; object-fit:cover; display:block; }

.lb-tags{
  /* float to the right of the centred photo without pushing it off-centre */
  position:absolute; left:100%; top:0; margin-left:14px; width:220px;
}
/* no left spacer needed now the photo is screen-centred */
.lb-stage::before{ display:none; }
/* photos with no assigned caption simply show no tags box */
.lb-stage.no-tags .lb-tags{ display:none; }
.lb-tags p{
  font-family:var(--font-body); font-size:13px; line-height:1.7; color:#3a3a38; margin:0;
}
.lb-tags strong{ display:block; margin-bottom:8px; color:var(--ink); }

@media (min-width:761px) and (max-width:1024px){
  .lb-topbar{ grid-template-columns:100px 1fr 100px; padding:16px 20px; }
  .lb-rail{ width:100px; flex:0 0 100px; padding:10px; gap:8px; }
  .lb-stage-wrap{ padding:20px; }
  .lb-frame.ratio-landscape{ width:min(58vw, 640px); }
  .lb-frame.ratio-portrait{ width:min(32vw, 340px); }
  .lb-info{ width:220px; flex:0 0 220px; padding:24px 20px; }
  .lb-info h3{ font-size:21px; }
  .lb-info p{ font-size:13px; }
  .lb-frame{ border-width:40px; }
  .lb-frame.has-photo img{ max-height:calc(61.05vh - 80px); max-width:calc(100vw - 100px - 220px - 140px); }
  .lb-frame.subcat-WSR.has-photo img{ max-height:calc(56.78vh - 80px); }
  .lb-tags{ width:120px; margin-left:10px; }
  .lb-stage::before{ flex-basis:120px; min-width:120px; }
}

.lb-info{
  width:320px; flex:0 0 320px; overflow-y:auto; padding:36px 32px;
  border-left:1px solid rgba(17,17,16,0.12);
  /* the stage-wrap is position:fixed (out of flow), so without this the info
     panel would slide left next to the collage — pin it to the far right */
  margin-left:auto;
}
.lb-info .eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 14px;
}
.lb-info h3{
  font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:-0.01em; margin:0 0 18px; line-height:1.1;
}
.lb-info p{
  font-size:14px; line-height:1.7; color:#3a3a38; margin:0;
}
.lb-info p + p{ margin-top:14px; }

.lb-bottombar{
  display:flex; justify-content:center; padding:22px 28px; border-top:1px solid rgba(17,17,16,0.12);
  flex:0 0 auto; position:relative; z-index:5;
}
.lb-bottombar button{
  background:none; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink);
}
.lb-bottombar button:hover{ color:var(--muted); }

@media (max-width:760px){
  .lb-topbar{ display:flex; justify-content:space-between; }
  .lb-body{ flex-direction:column; }
  .lb-rail{ width:100%; max-width:none; flex:0 0 auto; height:38vh; overflow-y:auto; border-right:none; border-bottom:1px solid rgba(17,17,16,0.12); }
  .lb-topbar{ grid-template-columns:100px 1fr 100px; }
  .lb-bottombar{ padding-left:28px; padding-right:28px; }
  .lb-frame{ border-width:22px; }
  .lb-frame.has-photo img{ max-height:calc(61.05vh - 44px); }
  .lb-frame.subcat-WSR.has-photo img{ max-height:calc(56.78vh - 44px); }
  .lb-frame.ratio-landscape, .lb-frame.ratio-portrait{ width:86vw; max-width:86vw; }
  /* EDIT: on phones un-pin the stage and stack tags below the photo */
  .lb-stage-wrap{ position:relative; inset:auto; z-index:auto; pointer-events:auto; flex:1 1 auto; }
}

/* Below 1024px there just isn't room for the tags box to float beside the
   photo without either the photo or the box being squeezed uncomfortably
   small, or the two overlapping — confirmed by measuring the real available
   space at these widths, not assumed. Stack it below the photo instead,
   same as it already does on true mobile. */
@media (max-width:1024px){
  .lb-stage{ flex-direction:column; gap:14px; }
  .lb-tags{ position:static; left:auto; margin-left:0; width:100%; }
}

@media (max-width:760px){
  .field{ height:auto; }
  .field-frame{
    position:static !important; left:auto !important; top:auto !important;
    width:82vw !important; margin:0 auto 20px; display:flex;
  }
  .corner-nav .links{ gap:10px; }
  .corner-nav a, .corner-nav span{ font-size:9px; }
}
</style>
</head>

  // time you reach it. Bottom value = how far ahead (as % of screen height).
  // threshold 0 fires as soon as any sliver enters that area — with 0.2 a
  // large frame had to be a fifth on-screen before it even began.
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }

  // -------------------- Home-field shuffle --------------------
  // Every visit, each home-field photo (except Image 20, whose caption and
  // the Unconditional Love write-up are tied to that specific photo) is
  // swapped for a DIFFERENT photo from the exact same category or
  // subcategory — a Fashion frame only ever shows another Fashion photo, a
  // Bali frame only another Bali photo, etc. The frame itself (position,
  // size, border, its own "Image NN" identity) never changes, only which
  // photo happens to be sitting in it right now. Assignment is done as a
  // proper shuffle-and-deal per group (not independent random picks per
  // frame), so the same photo can never land on two frames at once.
  (function shuffleFieldPhotos() {
    const PROTECTED_LABELS = new Set(['Image 20']);
    // .w-t1/.w-t2 are aspect-ratio 2/3 (portrait); every .w-l* is 3/2
    // (landscape) — a frame's own class is ground truth for the SHAPE it
    // needs, so a photo of the wrong orientation never gets swapped in,
    // however well it matches on category.
    function orientationOf(frame) {
      return /\bw-t\d/.test(frame.className) ? 'portrait' : 'landscape';
    }
    // combine category/subcat with orientation so pools never mix shapes
    function poolKeyFor(subcat, cat, orientation) { return (subcat || cat) + '|' + orientation; }

    const pools = {};        // key -> Set of every known photo src in that group+orientation
    const groupFrames = {};  // key -> [frame elements needing a photo from that group+orientation]

    function addToPool(key, src) {
      if (!key || !src) return;
      if (!pools[key]) pools[key] = new Set();
      pools[key].add(src);
    }

    frames.forEach(f => {
      const subcat = f.dataset.subcat || null;
      const cat = f.querySelector('figcaption')?.textContent || null;
      const orientation = orientationOf(f);
      const img = f.querySelector('img');
      const src = img && img.getAttribute('src');
      const key = poolKeyFor(subcat, cat, orientation);
      addToPool(key, src);
      if (!PROTECTED_LABELS.has(f.dataset.label)) {
        (groupFrames[key] = groupFrames[key] || []).push(f);
      }
    });
    Object.keys(extraCategoryPhotos).forEach(cat => {
      extraCategoryPhotos[cat].forEach(e => addToPool(poolKeyFor(null, cat, e.ratio || 'landscape'), e.src));
    });
    Object.keys(extraSubcatPhotos).forEach(subcat => {
      extraSubcatPhotos[subcat].forEach(e => addToPool(poolKeyFor(subcat, null, e.ratio || 'landscape'), e.src));
    });

    function shuffleArr(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    Object.keys(groupFrames).forEach(key => {
      const fs = groupFrames[key];
      const pool = pools[key] ? Array.from(pools[key]) : [];
      if (pool.length < 2 || fs.length === 0) return;

      // deal distinct photos to each frame in this group, no repeats within
      // the pass — if the pool is smaller than the number of frames, cycle
      // through a second shuffled pass rather than leaving any frame blank
      let deck = shuffleArr(pool.slice());
      shuffleArr(fs).forEach(f => {
        if (deck.length === 0) deck = shuffleArr(pool.slice());
        const pick = deck.pop();
        const img = f.querySelector('img');
        const thumbSrc = pick.replace('photos/', 'photos/thumb/');
        img.setAttribute('src', pick);
        img.setAttribute('srcset', thumbSrc + ' 400w, ' + pick + ' 1900w');
      });
    });
  })();

    currentCategoryItems = currentCategoryItems.concat(extras);

    // Same shuffle as browsing via the menu, so a category looks the same

    for (let i = currentCategoryItems.length - 1; i > 0; i--) {

  function openLightboxByCategory(cat) {

    for (let i = currentCategoryItems.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentCategoryItems[i], currentCategoryItems[j]] = [currentCategoryItems[j], currentCategoryItems[i]];

  // Open the lightbox filtered to a subcategory (e.g. "UL"). If startIndex is

    for (let i = currentCategoryItems.length - 1; i > 0; i--) {

      [currentCategoryItems[i], currentCategoryItems[j]] = [currentCategoryItems[j], currentCategoryItems[i]];
    }

    if (currentCategoryItems.length === 0) return; // nothing tagged into this subcategory yet

    currentPos = startIndex !== undefined
      ? currentCategoryItems.findIndex(x => x.i === startIndex)
      : 0;
    if (currentPos === -1) currentPos = 0;

    buildRail();
    render();
    lightbox.classList.add('open');

    document.body.classList.add('lb-open');
  }

  // EDIT: photos/ holds the full-size file (used by the lightbox stage).
  // photos/med/ (1400px) and photos/thumb/ (400px) hold display copies.
  // This swaps a full-size path for its smaller sibling.
  function variantSrc(src, kind) {
    if (!src) return src;
    return src.replace(/photos\//, 'photos/' + kind + '/');
  }

  function buildRail() {
    lbRail.innerHTML = '';
    currentCategoryItems.forEach((item, pos) => {
      const thumb = document.createElement('div');
      thumb.className = 'lb-thumb ratio-' + item.info.ratio;
      const localNum = String(pos + 1).padStart(2, '0');
      if (item.info.src) {
        // The whole rail is already fully visible the instant a category
        // opens (it's a small on-screen panel, not off-screen content), so
        // loading="lazy" was deferring images that never actually needed
        // deferring — browsers vary in how conservative their "near
        // viewport" heuristic is (Safari/mobile especially), which could
        // add a real, felt delay before thumbnails start appearing even
        // though nothing here needs scrolling into view. Removed; kept
        // decoding="async" so decoding still doesn't block the main thread.
        thumb.innerHTML = `<img src="${variantSrc(item.info.src, 'thumb')}" alt="Image ${localNum}" decoding="async">`;
        const tImg = thumb.querySelector('img');
        const fitThumb = () => { if (tImg.naturalWidth) thumb.style.aspectRatio = tImg.naturalWidth + ' / ' + tImg.naturalHeight; };
        if (tImg.complete) fitThumb(); else tImg.addEventListener('load', fitThumb);
      } else {
        thumb.innerHTML = `<div class="ph">Image ${localNum}</div>`;
      }
      thumb.addEventListener('click', () => { currentPos = pos; render(); });
      lbRail.appendChild(thumb);
    });
    layoutCollageRail();
  }

  // Masonry layout for the collage rail: 2 columns, stacked by real image
  // ratio so nothing overlaps. Recomputes on resize.
  function layoutCollageRail() {
    if (!lbRail || lbRail.offsetParent === null) return;
    const tiles = [...lbRail.querySelectorAll('.lb-thumb')];
    if (!tiles.length) return;
    const pad = 20, gap = 12;
    const railW = lbRail.clientWidth - pad * 2;
    const visibleH = lbRail.clientHeight - pad * 2;

    const ratios = tiles.map(t => {
      const img = t.querySelector('img');
      if (img && img.naturalWidth) return img.naturalWidth / img.naturalHeight;
      return t.classList.contains('ratio-portrait') ? 2 / 3 : 1.5;
    });

    // pack tiles into n columns at a given tile width (shortest column wins)
    function pack(ncols, colW) {
      const colH = new Array(ncols).fill(0);
      const pos = ratios.map(r => {
        const th = colW / r;
        let c = 0; for (let k = 1; k < ncols; k++) if (colH[k] < colH[c]) c = k;
        const top = colH[c];
        colH[c] += th + gap;
        return { c, top, h: th };
      });
      return { pos, height: Math.max(...colH) - gap };
    }

    let ncols = railW > 300 ? 2 : 1;
    let colW = (railW - gap * (ncols - 1)) / ncols;
    let laid = pack(ncols, colW);

    // EDIT: a short series used to leave the rail half empty, which made a
    // tight edit look thin rather than deliberate. If a set doesn't fill the
    // panel, fall back to fewer, LARGER tiles sized to fill the height.
    // Big sets are untouched — they still scroll at the normal tile size.
    if (laid.height < visibleH) {
      for (let n = 1; n < ncols; n++) {
        const maxW = (railW - gap * (n - 1)) / n;
        const base = pack(n, maxW);
        if (!base.height) continue;
        const w = Math.min(maxW, maxW * (visibleH / base.height));
        if (w > colW) { ncols = n; colW = w; laid = pack(n, w); }
      }
    }

    // centre a short set rather than stranding it at the top of the panel
    const offset = Math.max(0, (visibleH - laid.height) / 2);
    const totalW = ncols * colW + gap * (ncols - 1);
    const left0 = pad + Math.max(0, (railW - totalW) / 2);

    tiles.forEach((t, i) => {
      const q = laid.pos[i];
      t.style.width = colW + 'px';
      t.style.height = q.h + 'px';
      t.style.left = (left0 + q.c * (colW + gap)) + 'px';
      t.style.top = (offset + q.top) + 'px';
    });

    let spacer = lbRail.querySelector('.rail-spacer');
    if (!spacer) { spacer = document.createElement('div'); spacer.className = 'rail-spacer'; lbRail.appendChild(spacer); }
    spacer.style.cssText = 'position:absolute; left:0; top:0; width:1px; pointer-events:none;';
    spacer.style.height = (offset + laid.height + pad) + 'px';
    lbRail.style.minHeight = '';
  }

  // relayout when images finish loading (ratios become known) and on resize

    lbFrame.className = 'lb-frame ratio-' + info.ratio;
    // EDIT: tag the frame with the current subcategory so specific series
    // (e.g. WSR) can carry their own size cap
    if (currentBrowseSubcat) lbFrame.classList.add('subcat-' + currentBrowseSubcat);
    lbFrame.style.aspectRatio = '';
    lbFrame.style.removeProperty('--ar');
    const localLabel = 'Image ' + String(currentPos + 1).padStart(2, '0');
    if (info.src) {
      lbFrame.classList.add('has-photo');
      lbFrame.innerHTML = `<img src="${info.src}" alt="${localLabel}" decoding="async">`;
      const _img = lbFrame.querySelector('img');
      if (_img.complete) { /* already cached — fitStage() below covers it */ }
      else _img.addEventListener('load', fitStage, { once: true });
      // EDIT: real photos size the frame by their own height (max-height on the
      // img), so any ratio — landscape, portrait, cinematic — displays fully and
      // stays centred. No forced aspect-ratio on the frame.
    } else {
      lbFrame.classList.remove('has-photo');
      lbFrame.innerHTML = `<span>${localLabel}</span>`;
    }
    const displayCat = currentBrowseSubcat ? (subcatNames[currentBrowseSubcat] || currentBrowseSubcat) : info.cat;
    lbCat.textContent = displayCat;
    lbCount.textContent = String(currentPos + 1).padStart(2, '0') + ' / ' + String(currentCategoryItems.length).padStart(2, '0');
    lbInfoCat.textContent = displayCat;

    const story = imageToProject[info.label];
    // EDIT: unassigned photos show only "<Category> - Image NN" on the right —
    // no default text, no category eyebrow; single hyphen separator throughout
    const titleText = (story && story.title) || displayCat;
    lbInfoTitle.textContent = titleText + ' - Image ' + String(currentPos + 1).padStart(2, '0');
    lbInfoCat.style.display = story ? '' : 'none';
    lbInfoBody.innerHTML = story ? story.body.map(p => `<p>${p}</p>`).join('') : '';

    const caption = photoCaptions[info.label];
    const stageEl = lbFrame.closest('.lb-stage');
    // small per-photo caption floats beside the photo (info panel keeps the
    // big series write-up on the far right)
    if (caption) {
      stageEl.classList.remove('no-tags');
      lbTagsText.innerHTML = `<strong>${caption.name}</strong><br>${caption.text}`;
    } else {
      stageEl.classList.add('no-tags');
      lbTagsText.innerHTML = '';
    }

    Array.from(lbRail.children).forEach((el, i) => el.classList.toggle('active', i === currentPos));
    const activeThumb = lbRail.children[currentPos];
    if (activeThumb) activeThumb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    fitStage();
  }

  // Measures the real, current gap between the rail and the info panel and
  // subtracts the tags box's real rendered footprint (when it's showing),
  // then caps the photo to whatever's left — guaranteed not to overlap
  // either neighbour, at any viewport width, rather than a hand-derived
  // pixel formula that has to be re-verified every time anything nearby changes.
  function fitStage() {
    const info = document.querySelector('.lb-info');
    const frame = document.querySelector('.lb-frame');
    const img = frame && frame.querySelector('img');
    const tags = document.querySelector('.lb-tags');
    if (!info || !frame) return;
    frame.style.maxWidth = ''; if (img) img.style.maxWidth = '';
    if (tags) tags.style.width = '';
    if (window.innerWidth <= 1024) return; // tags stacks below the photo here — nothing to protect
    const SAFETY = 16;
    const MIN_TAGS = 70;
    // Neither the photo's rendered width nor exactly where it centres is
    // reliably predictable from outside the flex/centring layout (it depends
    // on the photo's own aspect ratio and box-model details that vary per
    // photo and breakpoint) — so measure the real, current overlap after
    // each change and correct again, converging empirically instead of
    // trying to calculate the right answer in one shot.
    for (let i = 0; i < 8; i++) {
      const infoLeft = info.getBoundingClientRect().left;
      const tagsShowing = tags && !frame.closest('.lb-stage').classList.contains('no-tags');
      const rightEdge = tagsShowing ? tags.getBoundingClientRect().right : frame.getBoundingClientRect().right;
      const overlap = rightEdge - infoLeft + SAFETY;
      if (overlap <= 0) break;
      if (tagsShowing && tags.getBoundingClientRect().width > MIN_TAGS) {
        // first give back room by narrowing the tags box itself, down to a
        // still-readable minimum, before touching the photo at all
        const w = tags.getBoundingClientRect().width;
        tags.style.width = Math.max(MIN_TAGS, w - overlap) + 'px';
      } else {
        // tags box is already as narrow as it should get — shrink the photo
        // instead. It's centred, so its right edge only moves in by about
        // half of any width reduction; overshoot the request and let the
        // next loop iteration correct any remainder.
        const fcs = getComputedStyle(frame);
        const borderTotal = parseFloat(fcs.borderLeftWidth || '0') + parseFloat(fcs.borderRightWidth || '0');
        const currentContentW = frame.getBoundingClientRect().width - borderTotal;
        const nextContentW = Math.max(80, currentContentW - overlap * 2.2);
        frame.style.maxWidth = nextContentW + 'px';
        if (img) img.style.maxWidth = nextContentW + 'px';
      }
    }
  }
  window.addEventListener('resize', () => setTimeout(fitStage, 120));

  function step(delta) {
    currentPos = (currentPos + delta + currentCategoryItems.length) % currentCategoryItems.length;
    render();
  }

  // clicking the stage photo advances to the next image in the category
  lbFrame.style.cursor = 'pointer';
  lbFrame.addEventListener('click', () => step(1));

  frameList.forEach((frame, i) => {
    frame.style.cursor = 'pointer';
    frame.addEventListener('click', () => openLightbox(i));
  });

  // ---------- INDEX OVERLAY ----------
  // Structure mirrors the site's own data so counts can never drift: a
  // category's number is exactly what opening it would show.
  const IDX = [
    ['Commercial', ['Workplace', 'Wellness']],
    ['Fashion', []],
    ['Portrait', []],
    ['Interiors', []],
    ['Personal', ['UL', 'Landscape', 'WSR', 'Vape', 'Street']],
    ['Travel', ['Bali', 'SriLanka']]
  ];
  const idxList    = document.getElementById('idx-list');

  const fieldInfos = () => frameList.map(f => frameInfo(f));

  // Counts must equal what opening that set actually shows, which includes
  // any frame still sitting on a grey placeholder.
  function subPhotos(sub) {
    return fieldInfos().filter(x => x.subcat === sub)
      .concat((extraSubcatPhotos[sub] || []).map(e => ({ src: e.src })));
  }
  function catPhotos(cat) {
    const subs = (IDX.find(r => r[0] === cat) || [null, []])[1];
    let out = fieldInfos().filter(x => x.cat === cat)
      .concat((extraCategoryPhotos[cat] || []).map(e => ({ src: e.src })));
    subs.forEach(s => { out = out.concat((extraSubcatPhotos[s] || []).map(e => ({ src: e.src }))); });
    return out;
  }

  // build the list from the same source of truth as the galleries
  IDX.forEach(([cat, subs]) => {
    const row = document.createElement('button');
    row.className = 'idx-row';
    row.dataset.cat = cat;
    row.innerHTML = cat + '<span class="idx-n">' + String(catPhotos(cat).length).padStart(2, '0') + '</span>';
    idxList.appendChild(row);
    if (subs.length) {
      const box = document.createElement('div');
      box.className = 'idx-subs';
      box.dataset.for = cat;
      subs.forEach(s => {
        const b = document.createElement('button');
        b.className = 'idx-sub';
        b.dataset.subcat = s;
        b.innerHTML = (subcatNames[s] || s) + '<i>' + String(subPhotos(s).length).padStart(2, '0') + '</i>';
        box.appendChild(b);
      });
      idxList.appendChild(box);
    }
  });

  function idxClear(sel) { idxList.querySelectorAll(sel).forEach(b => b.classList.remove('on')); }

  idxList.querySelectorAll('.idx-row').forEach(row => {
    const cat = row.dataset.cat;
    const subs = (IDX.find(r => r[0] === cat) || [null, []])[1];
    const preview = () => {
      idxClear('.idx-row'); idxClear('.idx-sub');
      row.classList.add('on');
      idxList.querySelectorAll('.idx-subs').forEach(b => b.classList.toggle('open', b.dataset.for === cat));
    };
    row.addEventListener('focus', preview);
    row.addEventListener('click', () => {
      preview();
      // categories with subcategories only reveal their choices, exactly as
      // the old nav behaved — they never open an unfiltered gallery
      if (!subs.length) { openLightboxByCategory(cat); }
    });
  });

  idxList.querySelectorAll('.idx-sub').forEach(b => {
    const preview = () => { idxClear('.idx-sub'); b.classList.add('on'); };
    b.addEventListener('mouseenter', preview);
    b.addEventListener('focus', preview);
    b.addEventListener('click', () => { openLightboxBySubcat(b.dataset.subcat); });
  });

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-back').addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>

</body>
</html>
