<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Louis Amore — Concept 05</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#efece6;
  --ink:#111110;
  --muted:#79766e;
  --font-display:'Archivo', sans-serif;
  --font-body:'Public Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }

/* the fixed, unmoving name — always readable via blend-mode, whatever
   scrolls beneath it */
.fixed-name{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:5; pointer-events:none;
}
.fixed-name h1{
  font-family:var(--font-display); font-weight:900; color:var(--ink);
  font-size:clamp(28px, 4.9vw, 67px); text-align:center; letter-spacing:-0.02em;
  line-height:0.95; margin:0; text-transform:uppercase; white-space:nowrap;
}
.fixed-name .role{
  font-family:var(--font-mono); color:var(--muted); font-size:11px; letter-spacing:.16em; font-weight:700;
  text-transform:uppercase; text-align:center; margin-top:14px;
}
.fixed-name .hero-statement{
  font-family:var(--font-display); font-weight:600; font-style:italic; color:var(--ink);
  font-size:clamp(13px,1.4vw,17px); text-align:center; max-width:26ch; margin:16px auto 0;
  line-height:1.4;
}

/* fixed corner nav, same blend trick so it's always legible */
.corner-nav{
  position:fixed; top:26px; left:0; right:0; z-index:41; pointer-events:none;
  display:flex; justify-content:space-between; padding:0 28px; mix-blend-mode:difference;
}
.corner-nav a, .corner-nav span{ color:#fff; font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; pointer-events:auto; }
.corner-nav .links{ display:flex; gap:18px; }

.quick-cats{
  position:fixed; top:52px; left:28px; z-index:41; pointer-events:auto;
  /* EDIT: modest spacing between category buttons; hit areas stay padded */
  display:flex; flex-direction:column; gap:6px;
}
.quick-cats button{
  background:none; border:none; padding:3px 0; margin:0; cursor:pointer; text-align:left;
  font-family:var(--font-display); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink); mix-blend-mode:normal; transition:color .15s ease;
}
.quick-cats button:hover{ color:var(--ink); }

.quick-cats-row{ display:flex; align-items:center; gap:8px; }
.quick-cats-toggle{
  font-size:12px !important; padding:3px 8px !important;
  color:var(--ink); transition:transform .15s ease, color .15s ease;
}
.quick-cats-toggle.open{ transform:rotate(90deg); }
.quick-subcats{
  display:none; flex-direction:column; gap:4px; margin:6px 0 0 12px;
  border-left:1px solid rgba(17,17,16,0.15); padding-left:10px;
}
.quick-subcats.open{ display:flex; }
/* EDIT: subcategory buttons were 9px and fiddly to click — now larger with
   padded hit areas */
.quick-subcats button{ font-size:11px; padding:3px 0; }

/* scrolling field of scattered work */
.field{ position:relative; height:745vh; margin-top:6vh; }
.field-frame{
  position:absolute; z-index:10; background:#d8d4cb; overflow:hidden;
  display:flex; align-items:flex-end;
  font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase;
  opacity:0; transform:translateY(26px); transition:opacity .7s ease, transform .7s ease;
}
.field-frame.in{ opacity:1; transform:translateY(0); }
.field-frame span{ padding:14px; }
.field-frame img{ width:100%; height:100%; object-fit:cover; display:block; }

/* Double-border: an outer border on the frame itself, plus an inner border
   on a wrapping div around the photo — no gap between them since the inner
   border sits flush against the outer one. Customize per-photo with inline
   CSS variables, e.g.:
   style="--db-outer:12px; --db-outer-color:#fff; --db-inner:2px; --db-inner-color:#111110;" */
.field-frame.double-border{
  border: var(--db-outer, 12px) solid var(--db-outer-color, #ffffff);
}
.field-frame.double-border .db-inner{
  width:100%; height:100%; box-sizing:border-box;
  border: var(--db-inner, 2px) solid var(--db-inner-color, #111110);
  overflow:hidden;
}
.field-frame::before{
  content: 'Image ' attr(data-num);
  position:absolute; top:0; left:0; z-index:20;
  background:rgba(17,17,16,0.78); color:#fff;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.04em;
  padding:5px 9px; pointer-events:none;
}
.field-frame figcaption{
  position:absolute; left:0; right:0; bottom:0; padding:12px 14px;
  background:linear-gradient(0deg, rgba(0,0,0,0.45), transparent);
  color:#fff; font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  opacity:0; transition:opacity .2s ease;
}
.field-frame:hover figcaption{ opacity:1; }

.row{ display:flex; }
.gap-a{ margin-bottom:0.1vh; }
.gap-b{ margin-bottom:0.3vh; }
.gap-c{ margin-bottom:0.25vh; }
.gap-d{ margin-bottom:0.5vh; }
.gap-e{ margin-bottom:0.05vh; }
.row.left{ justify-content:flex-start; }
.row.right{ justify-content:flex-end; }
.row.center{ justify-content:center; }
.row.split{ justify-content:space-between; align-items:flex-start; padding:0 4vw; }

.w-xs{ width:min(9vw, 110px); aspect-ratio:2/3; }
.w-sm{ width:min(12vw, 150px); aspect-ratio:2/3; }
.w-md{ width:min(19vw, 240px); aspect-ratio:3/2; }
.w-lg{ width:min(25vw, 320px); aspect-ratio:3/2; }
.w-xl{ width:min(30vw, 380px); aspect-ratio:3/2; }
.w-tall{ width:min(10vw, 125px); aspect-ratio:2/3; }
.w-2xs{ width:min(7vw, 90px); aspect-ratio:2/3; }
.w-2xl{ width:min(34vw, 440px); aspect-ratio:3/2; }
.w-med2{ width:min(23vw, 290px); aspect-ratio:3/2; }
.w-t1{ width:min(17vw, 220px); aspect-ratio:2/3; }
.w-t2{ width:min(24vw, 310px); aspect-ratio:2/3; }
.w-l1{ width:min(30vw, 390px); aspect-ratio:3/2; }
.w-l2{ width:min(42vw, 540px); aspect-ratio:3/2; }
.w-l3{ width:min(54vw, 700px); aspect-ratio:3/2; }

.pad-l{ padding-left:6vw; }
.pad-r{ padding-right:6vw; }

.field-frame.border-thick{ border:12px solid #111110; }
.field-frame.border-thin{ border:2px solid #111110; }
.field-frame.border-gold{ border:6px solid #a9852f; }
.field-frame.border-white{ border:12px solid #ffffff; }
.field-frame.border-white-thin{ border:2px solid #ffffff; }
.field-frame.border-white-thick{ border:24px solid #ffffff; }

.statement{ text-align:center; padding:8vh 28px 20vh; position:relative; z-index:1; }
.statement p{
  font-family:var(--font-display); font-weight:800; font-size:clamp(20px,3vw,32px);
  max-width:20ch; margin:0 auto; text-transform:uppercase; letter-spacing:-0.01em; line-height:1.2;
}

footer{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(239,236,230,0.92); backdrop-filter:blur(6px);
  padding:16px 28px; border-top:1px solid rgba(17,17,16,0.14);
  display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex-wrap:wrap; gap:12px;
}
.footer-links{ display:flex; gap:22px; }
.footer-links a{ color:var(--muted); border-bottom:1px solid transparent; transition:color .15s ease, border-color .15s ease; }
.footer-links a:hover{ color:var(--ink); border-color:var(--ink); }

/* --------------------------------------------------------------------- */
/* Lightbox — white rail + main image view                                */
/* --------------------------------------------------------------------- */

body.lb-open{ overflow:hidden; }

#lightbox{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  opacity:0; pointer-events:none; transition:opacity .3s ease;
  display:flex; flex-direction:column;
}
#lightbox.open{ opacity:1; pointer-events:auto; }

.lb-topbar{
  display:grid; grid-template-columns:150px 1fr 150px; align-items:center;
  position:relative; z-index:5;
  padding:22px 28px; border-bottom:1px solid rgba(17,17,16,0.12);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  flex:0 0 auto;
}
.lb-topbar #lb-cat{ text-align:left; }
.lb-topbar .lb-count{ text-align:center; }
.lb-topbar #lb-close{ justify-self:end; }
.lb-topbar button{ background:none; border:none; color:var(--ink); font:inherit; cursor:pointer; }
.lb-topbar button:hover{ color:var(--muted); }
.lb-count{ color:var(--ink); }

.lb-body{ flex:1 1 auto; display:flex; min-height:0; }

.lb-rail{
  width:30vw; max-width:440px; flex:0 0 30vw; overflow-y:auto; padding:20px;
  display:block; position:relative; border-right:1px solid rgba(17,17,16,0.12);
  height:100%; min-height:0;
}
.lb-thumb{
  position:absolute; margin:0; padding:0; background:#fff; cursor:pointer;
  box-shadow:0 6px 16px rgba(20,19,16,.14); opacity:1; border:none;
  transition:transform .25s ease, box-shadow .25s ease;
}
.lb-thumb:hover{ transform:scale(1.03); box-shadow:0 14px 30px rgba(20,19,16,.26); z-index:5; }
.lb-thumb.active{ opacity:1; }
.lb-thumb .ph{
  display:flex; align-items:center; justify-content:center; width:100%; height:100%;
  font-family:var(--font-mono); font-size:9px; color:var(--muted); text-transform:uppercase; background:#e7e4dc;
}
.lb-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

.lb-stage-wrap{
  /* pin to the whole viewport so the photo is dead-centre of the SCREEN
     (matching the approved layout); click-through except on the photo */
  position:fixed; inset:0; z-index:3; pointer-events:none;
  display:flex; align-items:center; justify-content:center; padding:40px;
}
.lb-stage-wrap .lb-stage, .lb-stage-wrap .lb-frame, .lb-stage-wrap .lb-tags{ pointer-events:auto; }
/* keep the centring spacer hidden but SHOW the small tags box again, pinned
   to the top beside the photo */
.lb-stage::before{ display:none !important; }
.lb-stage{
  position:relative; max-width:100%; max-height:100%;
  display:flex; align-items:center; justify-content:center; gap:24px;
  transform:scale(.97); opacity:0; transition:transform .3s ease, opacity .3s ease;
}
#lightbox.open .lb-stage{ transform:scale(1); opacity:1; }

.lb-frame{
  background:#e7e4dc; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase;
  flex:0 0 auto; min-width:0;
  /* EDIT: bold white mat that expands AROUND the photo (content-box), so the
     border never crops into the image. Sizing is HEIGHT-driven: the frame
     height-caps the photo and its width follows the photo's own ratio — so
     portrait and standard photos no longer balloon to full width, and every
     ratio stays centred over the counter. The mat adds 60px on every side. */
  border:60px solid #ffffff; box-sizing:content-box;
  height:auto; max-height:calc(61.05vh);
  max-width:calc(100% - 120px);
  box-shadow:0 24px 60px rgba(17,17,16,0.14);
}
/* the image itself carries the height cap; width follows naturally */
.lb-frame.has-photo img{ max-height:calc(61.05vh - 120px); width:auto; height:auto; max-width:100%; display:block; }
/* EDIT: We Shall Remember sized 7% smaller than the other categories */
.lb-frame.subcat-WSR.has-photo img{ max-height:calc(56.78vh - 120px); }
.lb-frame.ratio-landscape:not(.has-photo){ width:min(70vw, 900px); aspect-ratio:3/2; }
.lb-frame.ratio-portrait:not(.has-photo){ width:min(38vw, 480px); aspect-ratio:2/3; }
.lb-frame.has-photo{ width:auto; aspect-ratio:auto; }
.lb-frame span{ padding:16px; }
.lb-frame:not(.has-photo) img{ width:100%; height:100%; object-fit:cover; display:block; }

.lb-tags{
  /* float to the right of the centred photo without pushing it off-centre */
  position:absolute; left:100%; top:0; margin-left:28px; width:220px;
}
/* no left spacer needed now the photo is screen-centred */
.lb-stage::before{ display:none; }
/* photos with no assigned caption simply show no tags box */
.lb-stage.no-tags .lb-tags{ display:none; }
.lb-tags p{
  font-family:var(--font-body); font-size:13px; line-height:1.7; color:#3a3a38; margin:0;
}
.lb-tags strong{ display:block; margin-bottom:8px; color:var(--ink); }

@media (min-width:761px) and (max-width:1024px){
  .lb-topbar{ grid-template-columns:100px 1fr 100px; padding:16px 20px; }
  .lb-rail{ width:100px; flex:0 0 100px; padding:10px; gap:8px; }
  .lb-stage-wrap{ padding:20px; }
  .lb-frame.ratio-landscape{ width:min(58vw, 640px); }
  .lb-frame.ratio-portrait{ width:min(32vw, 340px); }
  .lb-info{ width:220px; flex:0 0 220px; padding:24px 20px; }
  .lb-info h3{ font-size:21px; }
  .lb-info p{ font-size:13px; }
  .lb-frame{ border-width:40px; }
  .lb-frame.has-photo img{ max-height:calc(61.05vh - 80px); }
  .lb-frame.subcat-WSR.has-photo img{ max-height:calc(56.78vh - 80px); }
  .lb-tags{ flex-basis:170px; min-width:120px; }
  .lb-stage::before{ flex-basis:170px; min-width:120px; }
}


.lb-info{
  width:320px; flex:0 0 320px; overflow-y:auto; padding:36px 32px;
  border-left:1px solid rgba(17,17,16,0.12);
  /* the stage-wrap is position:fixed (out of flow), so without this the info
     panel would slide left next to the collage — pin it to the far right */
  margin-left:auto;
}
.lb-info .eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 14px;
}
.lb-info h3{
  font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:-0.01em; margin:0 0 18px; line-height:1.1;
}
.lb-info p{
  font-size:14px; line-height:1.7; color:#3a3a38; margin:0;
}
.lb-info p + p{ margin-top:14px; }

.lb-bottombar{
  display:flex; justify-content:center; padding:22px 28px; border-top:1px solid rgba(17,17,16,0.12);
  flex:0 0 auto; position:relative; z-index:5;
}
.lb-bottombar button{
  background:none; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink);
}
.lb-bottombar button:hover{ color:var(--muted); }

@media (max-width:760px){
  .lb-topbar{ display:flex; justify-content:space-between; }
  .lb-body{ flex-direction:column; }
  .lb-rail{ width:100%; max-width:none; flex:0 0 auto; height:38vh; overflow-y:auto; border-right:none; border-bottom:1px solid rgba(17,17,16,0.12); }
  .lb-topbar{ grid-template-columns:100px 1fr 100px; }
  .lb-bottombar{ padding-left:28px; padding-right:28px; }
  .lb-frame{ border-width:22px; }
  .lb-frame.has-photo img{ max-height:calc(61.05vh - 44px); }
  .lb-frame.subcat-WSR.has-photo img{ max-height:calc(56.78vh - 44px); }
  .lb-frame.ratio-landscape, .lb-frame.ratio-portrait{ width:86vw; max-width:86vw; }
  /* EDIT: on phones un-pin the stage and stack tags below the photo */
  .lb-stage-wrap{ position:relative; inset:auto; z-index:auto; pointer-events:auto; flex:1 1 auto; }
  .lb-stage{ flex-direction:column; gap:14px; }
  .lb-tags{ position:static; left:auto; margin-left:0; width:100%; }
  .lb-info{ width:100%; flex:0 0 auto; border-left:none; border-top:1px solid rgba(17,17,16,0.12); padding:24px 28px; }
}

@media (max-width:760px){
  .field{ height:auto; }
  .field-frame{
    position:static !important; left:auto !important; top:auto !important;
    width:82vw !important; margin:0 auto 20px; display:flex;
  }
  .corner-nav .links{ gap:10px; }
  .corner-nav a, .corner-nav span{ font-size:9px; }
}
</style>
</head>

<script>
  // -------------------- Reveal + Lightbox --------------------
  const frames = document.querySelectorAll('.field-frame');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('in'); });
  }, { threshold: 0.2 });
  frames.forEach(f => io.observe(f));

  // -------------------- Lightbox --------------------
  const frameList = Array.from(frames);
  const lightbox = document.getElementById('lightbox');
  const lbFrame = document.getElementById('lb-frame');

  const lbCount = document.getElementById('lb-count');

  function frameInfo(frame) {
    const cat = frame.querySelector('figcaption').textContent;
    const spanEl = frame.querySelector('span');
    const imgEl = frame.querySelector('img');
    const label = frame.dataset.label || (spanEl ? spanEl.textContent : '');
    const subcat = frame.dataset.subcat || null;
    const isPortrait = Array.from(frame.classList).some(c => /^w-t/.test(c));
    return { cat, label, subcat, ratio: isPortrait ? 'portrait' : 'landscape', src: imgEl ? imgEl.src : null };
  }

  // EDIT: photos listed here don't need a spot on the homepage field at
  // all — they only ever show up in this category's rail when someone
  // clicks into it. Good for adding more photos to a category without

  // caption lookups too) and a ratio ('landscape' or 'portrait').

  function openLightbox(index) {
    const info = frameInfo(frameList[index]);
    if (info.subcat) {
      openLightboxBySubcat(info.subcat, index);
      return;
    }
    currentBrowseSubcat = null;
    // build the set of every photo in this same category, in page order
    currentCategoryItems = frameList
      .map((f, i) => ({ i, info: frameInfo(f) }))
      .filter(x => x.info.cat === info.cat);

    // add any rail-only extras for this category (not on the homepage field)
    const extras = (extraCategoryPhotos[info.cat] || []).map(e => ({ i: -1, info: { cat: info.cat, label: e.label, ratio: e.ratio, src: e.src || null } }));
    currentCategoryItems = currentCategoryItems.concat(extras);

    currentPos = currentCategoryItems.findIndex(x => x.i === index);

    buildRail();
    render();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lb-open');
  }

  // Open a full category from the quick-cats menu — always shows every photo
  // in that category, regardless of whether the first one happens to have
  // its own subcategory tag (that redirect only applies to direct photo clicks).
  function openLightboxByCategory(cat) {
    currentBrowseSubcat = null;
    currentCategoryItems = frameList
      .map((f, i) => ({ i, info: frameInfo(f) }))
      .filter(x => x.info.cat === cat);

    const extras = (extraCategoryPhotos[cat] || []).map(e => ({ i: -1, info: { cat, label: e.label, ratio: e.ratio, src: e.src || null } }));
    currentCategoryItems = currentCategoryItems.concat(extras);

    if (currentCategoryItems.length === 0) return;

    currentPos = 0;
    buildRail();
    render();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lb-open');
  }

  // Open the lightbox filtered to a subcategory (e.g. "UL"). If startIndex is
  // given (a real field photo was clicked), open on that photo; otherwise
  // open on the first photo found in the subcategory.
  function openLightboxBySubcat(subcat, startIndex) {
    currentBrowseSubcat = subcat;
    currentCategoryItems = frameList
      .map((f, i) => ({ i, info: frameInfo(f) }))
      .filter(x => x.info.subcat === subcat);

    const extras = (extraSubcatPhotos[subcat] || []).map(e => ({ i: -1, info: { cat: e.cat, label: e.label, subcat, ratio: e.ratio, src: e.src || null } }));
    currentCategoryItems = currentCategoryItems.concat(extras);

    if (currentCategoryItems.length === 0) return; // nothing tagged into this subcategory yet

    currentPos = startIndex !== undefined
      ? currentCategoryItems.findIndex(x => x.i === startIndex)
      : 0;
    if (currentPos === -1) currentPos = 0;

    buildRail();
    render();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lb-open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lb-open');
  }

  function buildRail() {
    lbRail.innerHTML = '';
    currentCategoryItems.forEach((item, pos) => {
      const thumb = document.createElement('div');
      thumb.className = 'lb-thumb ratio-' + item.info.ratio;
      const localNum = String(pos + 1).padStart(2, '0');
      if (item.info.src) {
        thumb.innerHTML = `<img src="${item.info.src}" alt="Image ${localNum}">`;
        // EDIT: thumbs also take the photo's true ratio so nothing is cropped
        const tImg = thumb.querySelector('img');
        const fitThumb = () => { if (tImg.naturalWidth) thumb.style.aspectRatio = tImg.naturalWidth + ' / ' + tImg.naturalHeight; };
        if (tImg.complete) fitThumb(); else tImg.addEventListener('load', fitThumb);
      } else {
        thumb.innerHTML = `<div class="ph">Image ${localNum}</div>`;
      }
      thumb.addEventListener('click', () => { currentPos = pos; render(); });
      lbRail.appendChild(thumb);
    });
    layoutCollageRail();
  }

  // Masonry layout for the collage rail: 2 columns, stacked by real image
  // ratio so nothing overlaps. Recomputes on resize.
  function layoutCollageRail() {
    if (!lbRail || lbRail.offsetParent === null) return;
    const tiles = [...lbRail.querySelectorAll('.lb-thumb')];
    if (!tiles.length) return;
    const pad = 20, gap = 12;
    const railW = lbRail.clientWidth - pad * 2;
    const NCOLS = railW > 300 ? 2 : 1;
    const colW = (railW - gap * (NCOLS - 1)) / NCOLS;
    const colH = new Array(NCOLS).fill(0);
    tiles.forEach((t) => {
      let ratio = 1.5;
      if (t.classList.contains('ratio-portrait')) ratio = 2 / 3;
      const img = t.querySelector('img');
      if (img && img.naturalWidth) ratio = img.naturalWidth / img.naturalHeight;
      const h = colW / ratio;
      let c = 0; for (let k = 1; k < NCOLS; k++) if (colH[k] < colH[c]) c = k;
      t.style.width = colW + 'px';
      t.style.height = h + 'px';
      t.style.left = (pad + c * (colW + gap)) + 'px';
      t.style.top = colH[c] + 'px';
      colH[c] += h + gap;
    });
    // give the rail a scrollable inner height via a spacer, and bound the rail
    // itself to the body height so overflow-y:auto actually scrolls
    let spacer = lbRail.querySelector('.rail-spacer');
    if (!spacer) { spacer = document.createElement('div'); spacer.className = 'rail-spacer'; lbRail.appendChild(spacer); }
    spacer.style.cssText = 'position:absolute; left:0; top:0; width:1px; pointer-events:none;';
    spacer.style.height = (Math.max(...colH) + pad) + 'px';
    lbRail.style.minHeight = '';
  }
  // relayout when images finish loading (ratios become known) and on resize
  window.addEventListener('resize', () => setTimeout(layoutCollageRail, 120));
  document.addEventListener('load', (e) => {
    if (e.target && e.target.tagName === 'IMG' && e.target.closest('#lb-rail')) layoutCollageRail();

  // EDIT: a "project" is a story that can span several photos — its title

  // Build a quick lookup: image label -> project

  // EDIT: a short per-photo caption for the small box beside the image —

    'WSR 16': { name: "Two Nations' Thanks", text: "British and Soviet decorations worn together on a winter coat." },
    'WSR 17': { name: 'Pennant Flying', text: "Regimental colours mounted proudly on the scooter." },
    'WSR 18': { name: 'A Debt Never Fully Repaid', text: "A pointed look from a man who was there." },
    'WSR 19': { name: 'Tweed and Bronze', text: "Stars from three campaigns, worn to the Cenotaph one more time." },
    'WSR 20': { name: 'Still Serving', text: "The next generation, in uniform among the veterans." },
    'WSR 21': { name: 'Desert Colours', text: "Two comrades in shemaghs, regimental ties beneath." },
    'WSR 22': { name: 'The Young Veteran', text: "Green beret, sharp suit \u2014 service isn't only history." },
    'WSR 23': { name: 'Watch Chain', text: "Sunday best and steady eyes against the old stone wall." },
    'WSR 24': { name: 'The Marks of War', text: "He carries his service on his face, and stands tall with it." },
    'WSR 25': { name: 'By the Railings', text: "Wrapped up against the cold, medals still on the outside." },
    'UL 04': {
      name: 'Candi & Calli',
      text: "Calli was rescued by Candi two and a half years ago from an abusive home. She nurtured her back to health and the bond between the two of them has grown very strong. Calli, a great support to Candi, has been trained to be her seizure dog. Originally from New Orleans, Candi and her husband moved to Tent City 3 eight months ago. Candi was the first person we met at the site, advocating for us to be allowed into the camp."
    },
    'Image 20': {
      name: 'Alicia, Braylen & Drew',
      text: "\u201cI got Drew for my son Braylen, I wanted him to have someone to play with,\u201d Alicia said. \u201cHe always roamed the encampment finding objects to keep himself entertained.\u201d They have lived at Tent City 3 for the past four months."
    },
    'UL 02': {
      name: 'Jamie & Meatball',
      text: "Jamie had found Meatball less than 24 hours before this photo was taken. Her previous dog, Nemesis, was purchased on the recommendation of her doctor as treatment for her schizoaffective disorder. \u201cMeatball provides me with motivation; life without animals would be much harder,\u201d she says."
    },
    'Image 18': {
      name: 'Sonny & Houdini',
      text: "Sonny has been living in Tent City 3 for 9 months. Houdini is Sonny's companion. He says, \u201che calms me down when I get my panic and anxiety attacks. I can get to my medicine because of Houdini. He calms me down when I get excited. Houdini gives me responsibility and pride.\u201d"
    },
    'UL 05': {
      name: 'Sonny & Houdini',
      text: "Sonny has been living in Tent City 3 for 9 months. Houdini is Sonny's companion. He says, \u201che calms me down when I get my panic and anxiety attacks. I can get to my medicine because of Houdini. He calms me down when I get excited. Houdini gives me responsibility and pride.\u201d"
    },
    'UL 09': {
      name: 'Maranda & Bully',
      text: "Maranda has been in Seattle for 5 years and has owned Bully since she was a puppy. Bully provides love and safety and a sense of security while Maranda's husband is away."
    },
    'UL 12': {
      name: 'Tent City 3',
      text: ""
    },
  };

  const defaultStory = {
    title: null, // falls back to "Category — Image N"
    body: [
      "A short paragraph about this project — the brief, the location, who it was for, or anything you want visitors to know.",
      "A second paragraph if you need more room to talk through the shoot, the client, or the story behind it."
    ]
  };

  function render() {
    const active = currentCategoryItems[currentPos];
    const info = active.info;
    lbFrame.className = 'lb-frame ratio-' + info.ratio;
    // EDIT: tag the frame with the current subcategory so specific series
    // (e.g. WSR) can carry their own size cap
    if (currentBrowseSubcat) lbFrame.classList.add('subcat-' + currentBrowseSubcat);
    lbFrame.style.aspectRatio = '';
    lbFrame.style.removeProperty('--ar');
    const localLabel = 'Image ' + String(currentPos + 1).padStart(2, '0');
    if (info.src) {
      lbFrame.classList.add('has-photo');
      lbFrame.innerHTML = `<img src="${info.src}" alt="${localLabel}">`;
      // EDIT: real photos size the frame by their own height (max-height on the
      // img), so any ratio — landscape, portrait, cinematic — displays fully and
      // stays centred. No forced aspect-ratio on the frame.
    } else {
      lbFrame.classList.remove('has-photo');
      lbFrame.innerHTML = `<span>${localLabel}</span>`;
    }
    const displayCat = currentBrowseSubcat ? (subcatNames[currentBrowseSubcat] || currentBrowseSubcat) : info.cat;
    lbCat.textContent = displayCat;
    lbCount.textContent = String(currentPos + 1).padStart(2, '0') + ' / ' + String(currentCategoryItems.length).padStart(2, '0');
    lbInfoCat.textContent = displayCat;

    const story = imageToProject[info.label];
    // EDIT: unassigned photos show only "<Category> - Image NN" on the right —
    // no default text, no category eyebrow; single hyphen separator throughout
    const titleText = (story && story.title) || displayCat;
    lbInfoTitle.textContent = titleText + ' - Image ' + String(currentPos + 1).padStart(2, '0');
    lbInfoCat.style.display = story ? '' : 'none';
    lbInfoBody.innerHTML = story ? story.body.map(p => `<p>${p}</p>`).join('') : '';

    const caption = photoCaptions[info.label];
    const stageEl = lbFrame.closest('.lb-stage');
    // small per-photo caption floats beside the photo (info panel keeps the
    // big series write-up on the far right)
    if (caption) {
      stageEl.classList.remove('no-tags');
      lbTagsText.innerHTML = `<strong>${caption.name}</strong><br>${caption.text}`;
    } else {
      stageEl.classList.add('no-tags');
      lbTagsText.innerHTML = '';
    }

    Array.from(lbRail.children).forEach((el, i) => el.classList.toggle('active', i === currentPos));
    const activeThumb = lbRail.children[currentPos];
    if (activeThumb) activeThumb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function step(delta) {
    currentPos = (currentPos + delta + currentCategoryItems.length) % currentCategoryItems.length;
    render();
  }

  // clicking the stage photo advances to the next image in the category
  lbFrame.style.cursor = 'pointer';
  lbFrame.addEventListener('click', () => step(1));

  frameList.forEach((frame, i) => {
    frame.style.cursor = 'pointer';
    frame.addEventListener('click', () => openLightbox(i));
  });

  function toggleSubcatList(triggerEl) {
    const group = triggerEl.closest('.quick-cats-group');
    const sublist = group.querySelector('.quick-subcats');
    const toggleArrow = group.querySelector('.quick-cats-toggle');
    toggleArrow.classList.toggle('open');
    sublist.classList.toggle('open');
  }

  // Top-level categories (no subcategories) open their gallery directly.
  document.querySelectorAll('.quick-cats > button[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      openLightboxByCategory(btn.dataset.cat);
    });
  });

  // A category with subcategories (e.g. Personal): clicking its label just
  // reveals the subcategory choices, same as clicking the arrow — it never
  // opens an unfiltered gallery on its own.
  document.querySelectorAll('.quick-cats-row button[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleSubcatList(btn);
    });
  });

  document.querySelectorAll('.quick-cats-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      toggleSubcatList(toggle);
    });
  });

  document.querySelectorAll('.quick-subcats button[data-subcat]').forEach(btn => {
    btn.addEventListener('click', () => {
      openLightboxBySubcat(btn.dataset.subcat);
    });
  });

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-back').addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>
