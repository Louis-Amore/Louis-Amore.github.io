<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Louis Amore — Concept 05</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#efece6;
  --ink:#111110;
  --muted:#79766e;
  --font-display:'Archivo', sans-serif;
  --font-body:'Public Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }

/* the fixed, unmoving name — always readable via blend-mode, whatever
   scrolls beneath it */
.fixed-name{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:5; pointer-events:none;
}
.fixed-name h1{
  font-family:var(--font-display); font-weight:900; color:var(--ink);
  font-size:clamp(28px, 4.9vw, 67px); text-align:center; letter-spacing:-0.02em;
  line-height:0.95; margin:0; text-transform:uppercase; white-space:nowrap;
}
.fixed-name .role{
  font-family:var(--font-mono); color:var(--muted); font-size:11px; letter-spacing:.16em; font-weight:700;
  text-transform:uppercase; text-align:center; margin-top:14px;
}
.fixed-name .hero-statement{
  font-family:var(--font-display); font-weight:600; font-style:italic; color:var(--ink);
  font-size:clamp(13px,1.4vw,17px); text-align:center; max-width:26ch; margin:16px auto 0;
  line-height:1.4;
}

/* fixed corner nav, same blend trick so it's always legible */
.corner-nav{
  position:fixed; top:26px; left:0; right:0; z-index:41; pointer-events:none;
  display:flex; justify-content:space-between; padding:0 28px; mix-blend-mode:difference;
}
.corner-nav a, .corner-nav span{ color:#fff; font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; pointer-events:auto; }
.corner-nav .links{ display:flex; gap:18px; }

.quick-cats{
  position:fixed; top:52px; left:28px; z-index:41; pointer-events:auto;
  display:flex; flex-direction:column; gap:6px;
}
.quick-cats button{
  background:none; border:none; padding:0; margin:0; cursor:pointer; text-align:left;
  font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); mix-blend-mode:normal; transition:color .15s ease;
}
.quick-cats button:hover{ color:var(--ink); }

.quick-cats-row{ display:flex; align-items:center; gap:6px; }
.quick-cats-toggle{
  font-size:9px !important; color:var(--muted); transition:transform .15s ease, color .15s ease;
}
.quick-cats-toggle.open{ transform:rotate(90deg); }
.quick-subcats{
  display:none; flex-direction:column; gap:5px; margin:5px 0 0 10px;
  border-left:1px solid rgba(17,17,16,0.15); padding-left:8px;
}
.quick-subcats.open{ display:flex; }
.quick-subcats button{ font-size:9px; }

/* scrolling field of scattered work */
.field{ position:relative; height:745vh; margin-top:6vh; }
.field-frame{
  position:absolute; z-index:10; background:#d8d4cb; overflow:hidden;
  display:flex; align-items:flex-end;
  font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase;
  opacity:0; transform:translateY(26px); transition:opacity .7s ease, transform .7s ease;
}
.field-frame.in{ opacity:1; transform:translateY(0); }
.field-frame span{ padding:14px; }
.field-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
.field-frame::before{
  content: 'Image ' attr(data-num);
  position:absolute; top:0; left:0; z-index:20;
  background:rgba(17,17,16,0.78); color:#fff;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.04em;
  padding:5px 9px; pointer-events:none;
}
.field-frame figcaption{
  position:absolute; left:0; right:0; bottom:0; padding:12px 14px;
  background:linear-gradient(0deg, rgba(0,0,0,0.45), transparent);
  color:#fff; font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  opacity:0; transition:opacity .2s ease;
}
.field-frame:hover figcaption{ opacity:1; }

.row{ display:flex; }
.gap-a{ margin-bottom:0.1vh; }
.gap-b{ margin-bottom:0.3vh; }
.gap-c{ margin-bottom:0.25vh; }
.gap-d{ margin-bottom:0.5vh; }
.gap-e{ margin-bottom:0.05vh; }
.row.left{ justify-content:flex-start; }
.row.right{ justify-content:flex-end; }
.row.center{ justify-content:center; }
.row.split{ justify-content:space-between; align-items:flex-start; padding:0 4vw; }

.w-xs{ width:min(9vw, 110px); aspect-ratio:2/3; }
.w-sm{ width:min(12vw, 150px); aspect-ratio:2/3; }
.w-md{ width:min(19vw, 240px); aspect-ratio:3/2; }
.w-lg{ width:min(25vw, 320px); aspect-ratio:3/2; }
.w-xl{ width:min(30vw, 380px); aspect-ratio:3/2; }
.w-tall{ width:min(10vw, 125px); aspect-ratio:2/3; }
.w-2xs{ width:min(7vw, 90px); aspect-ratio:2/3; }
.w-2xl{ width:min(34vw, 440px); aspect-ratio:3/2; }
.w-med2{ width:min(23vw, 290px); aspect-ratio:3/2; }
.w-t1{ width:min(17vw, 220px); aspect-ratio:2/3; }
.w-t2{ width:min(24vw, 310px); aspect-ratio:2/3; }
.w-l1{ width:min(30vw, 390px); aspect-ratio:3/2; }
.w-l2{ width:min(42vw, 540px); aspect-ratio:3/2; }
.w-l3{ width:min(54vw, 700px); aspect-ratio:3/2; }

.pad-l{ padding-left:6vw; }
.pad-r{ padding-right:6vw; }

.field-frame.border-thick{ border:12px solid #111110; }
.field-frame.border-thin{ border:2px solid #111110; }
.field-frame.border-gold{ border:6px solid #a9852f; }
.field-frame.border-white{ border:12px solid #ffffff; }
.field-frame.border-white-thick{ border:24px solid #ffffff; }

.statement{ text-align:center; padding:8vh 28px 20vh; position:relative; z-index:1; }
.statement p{
  font-family:var(--font-display); font-weight:800; font-size:clamp(20px,3vw,32px);
  max-width:20ch; margin:0 auto; text-transform:uppercase; letter-spacing:-0.01em; line-height:1.2;
}

footer{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(239,236,230,0.92); backdrop-filter:blur(6px);
  padding:16px 28px; border-top:1px solid rgba(17,17,16,0.14);
  display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex-wrap:wrap; gap:12px;
}
.footer-links{ display:flex; gap:22px; }
.footer-links a{ color:var(--muted); border-bottom:1px solid transparent; transition:color .15s ease, border-color .15s ease; }
.footer-links a:hover{ color:var(--ink); border-color:var(--ink); }

/* --------------------------------------------------------------------- */
/* Lightbox — white rail + main image view                                */
/* --------------------------------------------------------------------- */

body.lb-open{ overflow:hidden; }

#lightbox{
  position:fixed; inset:0; z-index:100; background:#fdfcfa;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
  display:flex; flex-direction:column;
}
#lightbox.open{ opacity:1; pointer-events:auto; }

.lb-topbar{
  display:grid; grid-template-columns:150px 1fr 320px; align-items:center;
  padding:22px 28px; border-bottom:1px solid rgba(17,17,16,0.12);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  flex:0 0 auto;
}
.lb-topbar #lb-cat{ text-align:left; }
.lb-topbar .lb-count{ text-align:center; }
.lb-topbar #lb-close{ justify-self:end; }
.lb-topbar button{ background:none; border:none; color:var(--ink); font:inherit; cursor:pointer; }
.lb-topbar button:hover{ color:var(--muted); }
.lb-count{ color:var(--ink); }

.lb-body{ flex:1 1 auto; display:flex; min-height:0; }

.lb-rail{
  width:150px; flex:0 0 150px; overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:12px; border-right:1px solid rgba(17,17,16,0.12);
}
.lb-thumb{
  background:#e7e4dc; cursor:pointer; position:relative;
  border:2px solid transparent; transition:border-color .15s ease, opacity .15s ease;
  opacity:.65;
}
.lb-thumb:hover{ opacity:1; }
.lb-thumb.active{ opacity:1; border-color:var(--ink); }
.lb-thumb .ph{
  display:flex; align-items:center; justify-content:center; width:100%; height:100%;
  font-family:var(--font-mono); font-size:9px; color:var(--muted); text-transform:uppercase;
}
.lb-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.lb-thumb.ratio-landscape{ aspect-ratio:3/2; }
.lb-thumb.ratio-portrait{ aspect-ratio:2/3; }

.lb-stage-wrap{
  flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:40px; min-width:0;
}
.lb-stage{
  position:relative; max-width:100%; max-height:100%;
  transform:scale(.97); opacity:0; transition:transform .3s ease, opacity .3s ease;
}
#lightbox.open .lb-stage{ transform:scale(1); opacity:1; }

.lb-frame{
  background:#e7e4dc; display:flex; align-items:flex-end;
  font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase;
  max-height:80vh;
}
.lb-frame.ratio-landscape{ width:min(70vw, 900px); aspect-ratio:3/2; }
.lb-frame.ratio-portrait{ width:min(38vw, 480px); aspect-ratio:2/3; }
.lb-frame span{ padding:16px; }
.lb-frame img{ width:100%; height:100%; object-fit:cover; display:block; }

.lb-tags{
  position:absolute; top:0; left:100%; margin-left:24px; width:290px;
}
.lb-tags p{
  font-family:var(--font-body); font-size:13px; line-height:1.7; color:#3a3a38; margin:0;
}
.lb-tags strong{ display:block; margin-bottom:8px; color:var(--ink); }

@media (min-width:761px) and (max-width:1024px){
  .lb-topbar{ grid-template-columns:100px 1fr 220px; padding:16px 20px; }
  .lb-rail{ width:100px; flex:0 0 100px; padding:10px; gap:8px; }
  .lb-stage-wrap{ padding:20px; }
  .lb-frame.ratio-landscape{ width:min(58vw, 640px); }
  .lb-frame.ratio-portrait{ width:min(32vw, 340px); }
  .lb-info{ width:220px; flex:0 0 220px; padding:24px 20px; }
  .lb-info h3{ font-size:21px; }
  .lb-info p{ font-size:13px; }
  .lb-tags{ width:170px; margin-left:16px; }
}


.lb-info{
  width:320px; flex:0 0 320px; overflow-y:auto; padding:36px 32px;
  border-left:1px solid rgba(17,17,16,0.12);
}
.lb-info .eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 14px;
}
.lb-info h3{
  font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:-0.01em; margin:0 0 18px; line-height:1.1;
}
.lb-info p{
  font-size:14px; line-height:1.7; color:#3a3a38; margin:0;
}
.lb-info p + p{ margin-top:14px; }

.lb-bottombar{
  display:flex; justify-content:center; padding:22px 28px; border-top:1px solid rgba(17,17,16,0.12);
  flex:0 0 auto;
}
.lb-bottombar button{
  background:none; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink);
}
.lb-bottombar button:hover{ color:var(--muted); }

@media (max-width:760px){
  .lb-topbar{ display:flex; justify-content:space-between; }
  .lb-body{ flex-direction:column; }
  .lb-rail{ width:100%; flex:0 0 90px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid rgba(17,17,16,0.12); }
  .lb-thumb{ flex:0 0 70px; }
  .lb-frame.ratio-landscape, .lb-frame.ratio-portrait{ width:86vw; max-width:86vw; }
  .lb-info{ width:100%; flex:0 0 auto; border-left:none; border-top:1px solid rgba(17,17,16,0.12); padding:24px 28px; }
}

@media (max-width:760px){
  .field{ height:auto; }
  .field-frame{
    position:static !important; left:auto !important; top:auto !important;
    width:82vw !important; margin:0 auto 20px; display:flex;
  }
  .corner-nav .links{ gap:10px; }
  .corner-nav a, .corner-nav span{ font-size:9px; }
}
</style>

<script>
  // -------------------- Reveal + Lightbox --------------------
  const frames = document.querySelectorAll('.field-frame');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('in'); });
  }, { threshold: 0.2 });
  frames.forEach(f => io.observe(f));

  // -------------------- Lightbox --------------------
  const frameList = Array.from(frames);
  const lightbox = document.getElementById('lightbox');
  const lbFrame = document.getElementById('lb-frame');
  const lbCat = document.getElementById('lb-cat');
  const lbCount = document.getElementById('lb-count');
  const lbRail = document.getElementById('lb-rail');
  const lbInfoCat = document.getElementById('lb-info-cat');
  const lbInfoTitle = document.getElementById('lb-info-title');
  const lbInfoBody = document.getElementById('lb-info-body');
  const lbTagsText = document.getElementById('lb-tags-text');
  let currentCategoryItems = [];
  let currentPos = 0;

  function frameInfo(frame) {
    const cat = frame.querySelector('figcaption').textContent;
    const spanEl = frame.querySelector('span');
    const imgEl = frame.querySelector('img');
    const label = frame.dataset.label || (spanEl ? spanEl.textContent : '');
    const subcat = frame.dataset.subcat || null;
    const isPortrait = Array.from(frame.classList).some(c => /^w-t/.test(c));
    return { cat, label, subcat, ratio: isPortrait ? 'portrait' : 'landscape', src: imgEl ? imgEl.src : null };
  }

  // EDIT: photos listed here don't need a spot on the homepage field at
  // all — they only ever show up in this category's rail when someone
  // clicks into it. Good for adding more photos to a category without
  // touching the homepage. Give each one a label (used for project/
  // caption lookups too) and a ratio ('landscape' or 'portrait').
  const extraCategoryPhotos = {
    'Portrait': [
      { label: 'Extra Portrait 1', ratio: 'portrait' },
      { label: 'Extra Portrait 2', ratio: 'landscape' },
      { label: 'Extra Portrait 3', ratio: 'portrait' },
    ],
    'Fashion': [
      { label: 'Fashion 01', ratio: 'landscape', src: 'photos/fashion-01.jpg' },
      { label: 'Fashion 03', ratio: 'landscape', src: 'photos/fashion-03.jpg' },
      { label: 'Fashion 05', ratio: 'portrait', src: 'photos/fashion-05.jpg' },
      { label: 'Fashion 06', ratio: 'landscape', src: 'photos/fashion-06.jpg' },
      { label: 'Fashion 07', ratio: 'landscape', src: 'photos/fashion-07.jpg' },
      { label: 'Fashion 09', ratio: 'portrait', src: 'photos/fashion-09.jpg' },
      { label: 'Fashion 11', ratio: 'portrait', src: 'photos/fashion-11.jpg' },
      { label: 'Fashion 12', ratio: 'landscape', src: 'photos/fashion-12.jpg' },
      { label: 'Fashion 13', ratio: 'portrait', src: 'photos/fashion-13.jpg' },
      { label: 'Fashion 14', ratio: 'landscape', src: 'photos/fashion-14.jpg' },
      { label: 'Fashion 15', ratio: 'portrait', src: 'photos/fashion-15.jpg' },
      { label: 'Fashion 17', ratio: 'portrait', src: 'photos/fashion-17.jpg' },
      { label: 'Fashion 19', ratio: 'portrait', src: 'photos/fashion-19.jpg' },
    ],
  };

  // EDIT: same idea as extraCategoryPhotos, but for a subcategory's rail —
  // add a "cat" so the info panel still knows the main category too.
  const extraSubcatPhotos = {
    'UL': [
      { label: 'UL 02', cat: 'Personal', ratio: 'landscape', src: 'photos/personal-02.jpg' },
      { label: 'UL 03', cat: 'Personal', ratio: 'landscape', src: 'photos/personal-03.jpg' },
      { label: 'UL 04', cat: 'Personal', ratio: 'landscape', src: 'photos/personal-04.jpg' },
      { label: 'UL 05', cat: 'Personal', ratio: 'landscape', src: 'photos/personal-05.jpg' },
      { label: 'UL 09', cat: 'Personal', ratio: 'landscape', src: 'photos/personal-09.jpg' },
      { label: 'UL 12', cat: 'Personal', ratio: 'landscape', src: 'photos/personal-12.jpg' },
    ],
  };

  // EDIT: full display names for subcategory abbreviations used in data-subcat.
  const subcatNames = {
    'UL': 'Unconditional Love',
    'Bali': 'Bali',
  };

  function openLightbox(index) {
    const info = frameInfo(frameList[index]);
    if (info.subcat) {
      openLightboxBySubcat(info.subcat, index);
      return;
    }
    // build the set of every photo in this same category, in page order
    currentCategoryItems = frameList
      .map((f, i) => ({ i, info: frameInfo(f) }))
      .filter(x => x.info.cat === info.cat);

    // add any rail-only extras for this category (not on the homepage field)
    const extras = (extraCategoryPhotos[info.cat] || []).map(e => ({ i: -1, info: { cat: info.cat, label: e.label, ratio: e.ratio, src: e.src || null } }));
    currentCategoryItems = currentCategoryItems.concat(extras);

    currentPos = currentCategoryItems.findIndex(x => x.i === index);

    buildRail();
    render();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lb-open');
  }

  // Open the lightbox filtered to a subcategory (e.g. "UL"). If startIndex is
  // given (a real field photo was clicked), open on that photo; otherwise
  // open on the first photo found in the subcategory.
  function openLightboxBySubcat(subcat, startIndex) {
    currentCategoryItems = frameList
      .map((f, i) => ({ i, info: frameInfo(f) }))
      .filter(x => x.info.subcat === subcat);

    const extras = (extraSubcatPhotos[subcat] || []).map(e => ({ i: -1, info: { cat: e.cat, label: e.label, subcat, ratio: e.ratio, src: e.src || null } }));
    currentCategoryItems = currentCategoryItems.concat(extras);

    currentPos = startIndex !== undefined
      ? currentCategoryItems.findIndex(x => x.i === startIndex)
      : 0;
    if (currentPos === -1) currentPos = 0;

    buildRail();
    render();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lb-open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lb-open');
  }

  function buildRail() {
    lbRail.innerHTML = '';
    currentCategoryItems.forEach((item, pos) => {
      const thumb = document.createElement('div');
      thumb.className = 'lb-thumb ratio-' + item.info.ratio;
      const localNum = String(pos + 1).padStart(2, '0');
      if (item.info.src) {
        thumb.innerHTML = `<img src="${item.info.src}" alt="Image ${localNum}">`;
      } else {
        thumb.innerHTML = `<div class="ph">Image ${localNum}</div>`;
      }
      thumb.addEventListener('click', () => { currentPos = pos; render(); });
      lbRail.appendChild(thumb);
    });
  }

  // EDIT: a "project" is a story that can span several photos — its title
  // and write-up always show in the info panel for every image listed
  // under it. Add more image labels to "images" as you tag more photos
  // into the same project.
  const projects = {
    'unconditional-love': {
      title: 'Unconditional Love',
      body: [
        "In October 2017 I visited a good friend in Seattle, Washington who runs an international animal rescue organisation. Animals can have a positive impact on people's lives. Unfortunately, I also saw and learned how much animals suffer abuse around the world.",
        "During my visit I saw that many homeless people kept animals with them and it gave me an idea to document their connection and dependence on each other. I approached and sought permission to photograph in Tent City 3 — a non-sanctioned temporary homeless encampment — and also other homeless people throughout the area.",
        "Animals accept us as we are. They love unconditionally and without reserve. They bring joy, love and reassurance during our best and worst times. I felt compelled to use this connection; the unwavering bond between human and animal as the basis for this series — \"Unconditional Love\"."
      ],
      images: ['Image 18', 'Image 20', 'UL 02', 'UL 03', 'UL 04', 'UL 05', 'UL 09', 'UL 12']
    }
  };

  // Build a quick lookup: image label -> project
  const imageToProject = {};
  Object.values(projects).forEach(p => {
    p.images.forEach(label => { imageToProject[label] = p; });
  });

  // EDIT: a short per-photo caption for the small box beside the image —
  // who's in it, a name, a detail, and optionally a bit more text below
  // it. Falls back to generic mood words if a photo doesn't have one yet.
  const photoCaptions = {
    'UL 04': {
      name: 'Candi & Calli',
      text: "Calli was rescued by Candi two and a half years ago from an abusive home. She nurtured her back to health and the bond between the two of them has grown very strong. Calli, a great support to Candi, has been trained to be her seizure dog. Originally from New Orleans, Candi and her husband moved to Tent City 3 eight months ago. Candi was the first person we met at the site, advocating for us to be allowed into the camp."
    },
    'Image 20': {
      name: 'Alicia, Braylen & Drew',
      text: "\u201cI got Drew for my son Braylen, I wanted him to have someone to play with,\u201d Alicia said. \u201cHe always roamed the encampment finding objects to keep himself entertained.\u201d They have lived at Tent City 3 for the past four months."
    },
    'UL 02': {
      name: 'Jamie & Meatball',
      text: "Jamie had found Meatball less than 24 hours before this photo was taken. Her previous dog, Nemesis, was purchased on the recommendation of her doctor as treatment for her schizoaffective disorder. \u201cMeatball provides me with motivation; life without animals would be much harder,\u201d she says."
    },
    'Image 18': {
      name: 'Sonny & Houdini',
      text: "Sonny has been living in Tent City 3 for 9 months. Houdini is Sonny's companion. He says, \u201che calms me down when I get my panic and anxiety attacks. I can get to my medicine because of Houdini. He calms me down when I get excited. Houdini gives me responsibility and pride.\u201d"
    },
    'UL 05': {
      name: 'Sonny & Houdini',
      text: "Sonny has been living in Tent City 3 for 9 months. Houdini is Sonny's companion. He says, \u201che calms me down when I get my panic and anxiety attacks. I can get to my medicine because of Houdini. He calms me down when I get excited. Houdini gives me responsibility and pride.\u201d"
    },
    'UL 09': {
      name: 'Maranda & Bully',
      text: "Maranda has been in Seattle for 5 years and has owned Bully since she was a puppy. Bully provides love and safety and a sense of security while Maranda's husband is away."
    },
    'UL 12': {
      name: 'Tent City 3',
      text: ""
    },
  };

  const defaultStory = {
    title: null, // falls back to "Category — Image N"
    body: [
      "A short paragraph about this project — the brief, the location, who it was for, or anything you want visitors to know.",
      "A second paragraph if you need more room to talk through the shoot, the client, or the story behind it."
    ]
  };

  function render() {
    const active = currentCategoryItems[currentPos];
    const info = active.info;
    lbFrame.className = 'lb-frame ratio-' + info.ratio;
    const localLabel = 'Image ' + String(currentPos + 1).padStart(2, '0');
    if (info.src) {
      lbFrame.innerHTML = `<img src="${info.src}" alt="${localLabel}">`;
    } else {
      lbFrame.innerHTML = `<span>${localLabel}</span>`;
    }
    const displayCat = info.subcat ? (subcatNames[info.subcat] || info.subcat) : info.cat;
    lbCat.textContent = displayCat;
    lbCount.textContent = String(currentPos + 1).padStart(2, '0') + ' / ' + String(currentCategoryItems.length).padStart(2, '0');
    lbInfoCat.textContent = displayCat;

    const story = imageToProject[info.label] || defaultStory;
    const titleText = story.title || info.cat;
    lbInfoTitle.textContent = titleText + ' — Image ' + String(currentPos + 1).padStart(2, '0');
    lbInfoBody.innerHTML = story.body.map(p => `<p>${p}</p>`).join('');

    const caption = photoCaptions[info.label];
    if (caption) {
      lbTagsText.innerHTML = `<strong>${caption.name}</strong><br>${caption.text}`;
    } else {
      lbTagsText.innerHTML = 'moody · natural light · editorial';
    }

    Array.from(lbRail.children).forEach((el, i) => el.classList.toggle('active', i === currentPos));
    const activeThumb = lbRail.children[currentPos];
    if (activeThumb) activeThumb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function step(delta) {
    currentPos = (currentPos + delta + currentCategoryItems.length) % currentCategoryItems.length;
    render();
  }

  frameList.forEach((frame, i) => {
    frame.style.cursor = 'pointer';
    frame.addEventListener('click', () => openLightbox(i));
  });

  document.querySelectorAll('.quick-cats > button[data-cat], .quick-cats-row button[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      const index = frameList.findIndex(f => frameInfo(f).cat === cat);
      if (index !== -1) openLightbox(index);
    });
  });

  document.querySelectorAll('.quick-cats-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      const sublist = toggle.closest('.quick-cats-group').querySelector('.quick-subcats');
      toggle.classList.toggle('open');
      sublist.classList.toggle('open');
    });
  });

  document.querySelectorAll('.quick-subcats button[data-subcat]').forEach(btn => {
    btn.addEventListener('click', () => {
      openLightboxBySubcat(btn.dataset.subcat);
    });
  });

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-back').addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>

</body>
</html>
