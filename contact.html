<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Contact — Louis Amore</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#111110;
  --ink:#f5f4f0;
  --muted:#8a8a86;
  --font-display:'Archivo', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{ box-sizing:border-box; }
html, body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-mono); font-size:15px;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
a{ color:inherit; text-decoration:none; }
a:focus-visible, button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

.top-nav{
  display:flex; justify-content:space-between; align-items:center;
  padding:26px 28px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
}
.top-nav a:hover{ color:var(--ink); }

main{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px 24px;
}

.eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:22px; }

h1{
  font-family:var(--font-display); font-weight:900; text-transform:uppercase;
  font-size:clamp(56px, 12vw, 160px); line-height:0.9; letter-spacing:-0.02em; margin:0;
}

.tagline{
  font-size:16px; color:#c9c8c3; max-width:38ch; margin:26px 0 40px; line-height:1.6;
}

.email-link{
  font-family:var(--font-display); font-weight:800; font-size:clamp(20px, 3vw, 32px);
  border-bottom:2px solid var(--ink); padding-bottom:6px; transition:opacity .2s ease;
}
.email-link:hover{ opacity:.7; }

.sub-links{
  margin-top:36px; display:flex; gap:24px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
}
.sub-links a:hover{ color:var(--ink); }

footer{
  display:flex; justify-content:space-between; padding:22px 28px;
  font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
}

@media (max-width:600px){
  .sub-links{ flex-direction:column; gap:12px; align-items:center; }
}
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">← Back to work</a>
  <a href="#">Louis Amore</a>
</div>

<main>
  <p class="eyebrow">Get in touch</p>
  <h1>Let's Shoot.</h1>
  <p class="tagline">For commissions, collaborations, or just to talk about
  a project — drop a line and I'll get back to you within a couple of days.</p>
  <a class="email-link" href="mailto:louis.amore@gmail.com">louis.amore@gmail.com</a>

  <div class="sub-links">
    <a href="https://www.instagram.com/louis_amore_photographer/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.linkedin.com/in/louisamore/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</main>

<footer>
  <span>© Louis Amore</span>
  <span>Concept 05 — Contact</span>
</footer>

</body>
</html>
